<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#1B3A5C" />
  <title>Checklist Axial</title>

  <!-- React 18 (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>

  <!-- Babel Standalone para compilar JSX no browser -->
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <!-- Supabase SDK -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #F9FAFB; }
    #root { min-height: 100vh; }
    #boot-loader {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px; background: #F9FAFB; z-index: 9999;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #1B3A5C; padding: 20px; text-align: center;
    }
    #boot-loader .spinner {
      width: 44px; height: 44px; border: 4px solid #E5E7EB;
      border-top-color: #1B3A5C; border-radius: 50%;
      animation: bootspin 0.9s linear infinite;
    }
    @keyframes bootspin { to { transform: rotate(360deg); } }
    .boot-hide { display: none !important; }
    #error-overlay {
      display: none;
      position: fixed; inset: 0; background: #FEF2F2; z-index: 10000;
      padding: 20px; overflow: auto; font-family: monospace; font-size: 13px;
      color: #991B1B; white-space: pre-wrap; word-break: break-word;
    }
    #error-overlay h2 { color: #7F1D1D; margin-top: 0; font-family: 'Inter', sans-serif; }
  </style>
</head>
<body>
  <div id="boot-loader">
    <div class="spinner"></div>
    <div style="font-weight:600;font-size:14px;">Carregando Checklist Axial…</div>
    <div style="font-size:11px;opacity:0.6;max-width:300px;">A primeira carga pode levar alguns segundos enquanto o JSX é compilado.</div>
  </div>
  <div id="error-overlay">
    <h2>⚠️ Erro ao carregar o app</h2>
    <div id="error-message"></div>
  </div>
  <div id="root"></div>

  <script>
    // Captura erros globais e exibe na tela (útil pra debug em produção)
    window.addEventListener('error', function(e) {
      const overlay = document.getElementById('error-overlay');
      const msg = document.getElementById('error-message');
      if (overlay && msg) {
        overlay.style.display = 'block';
        const errInfo = (e.error && e.error.stack) || e.message || String(e);
        msg.textContent = errInfo + '\n\nArquivo: ' + (e.filename || '?') + ':' + (e.lineno || '?');
      }
      document.getElementById('boot-loader')?.classList.add('boot-hide');
    });
    window.addEventListener('unhandledrejection', function(e) {
      const overlay = document.getElementById('error-overlay');
      const msg = document.getElementById('error-message');
      if (overlay && msg) {
        overlay.style.display = 'block';
        msg.textContent = 'Promise rejeitada: ' + (e.reason && e.reason.stack || e.reason || 'desconhecido');
      }
    });
  </script>

function LucideIcon({ name, size = 24, color = 'currentColor', strokeWidth = 2, style, ...rest }) {
  const paths = ICON_PATHS[name];
  if (!paths) {
    console.warn('Ícone não encontrado:', name);
    return null;
  }
  return React.createElement('svg', {
    xmlns: 'http://www.w3.org/2000/svg',
    width: size,
    height: size,
    viewBox: '0 0 24 24',
    fill: 'none',
    stroke: color,
    strokeWidth: strokeWidth,
    strokeLinecap: 'round',
    strokeLinejoin: 'round',
    style,
    dangerouslySetInnerHTML: { __html: paths },
    ...rest,
  });
}

// Gera uma "chave" (slug) a partir do nome de um equipamento novo.
// Ex: "Compressor de Ar" -> "compressor_de_ar"
function gerarChaveEquip(nome) {
  const base = (nome || '')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // remove acentos
    .replace(/[^a-z0-9]+/g, '_')
    .replace(/^_+|_+$/g, '');
  return base || ('equip_' + Date.now());
}

// Converte uma data URL base64 (ex: foto tirada pelo celular) num Blob
// pra fazer upload eficiente no Storage
function dataUrlParaBlob(dataUrl) {
  const partes = dataUrl.split(',');
  const mime = partes[0].match(/:(.*?);/)?.[1] || 'image/jpeg';
  const bin = atob(partes[1]);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

// Gera um nome único pra arquivo de foto
function gerarNomeArquivoFoto(extensao) {
  const ts = Date.now();
  const rand = Math.random().toString(36).slice(2, 10);
  return `foto_${ts}_${rand}.${extensao || 'jpg'}`;
}

// Sobe uma foto (data URL base64) pro Storage e retorna a URL pública.
// Se for uma URL http(s) já (foto já existente), retorna ela mesma.
async function subirFotoParaStorage(fotoDataUrlOuUrl) {
  if (!fotoDataUrlOuUrl) return null;
  // Se já é URL pública (foto vinda de checklist antigo, por ex.), retorna direto
  if (fotoDataUrlOuUrl.startsWith('http://') || fotoDataUrlOuUrl.startsWith('https://')) {
    return fotoDataUrlOuUrl;
  }
  // Se for SVG inline (assinatura fake dos mocks, ou assinatura real), também sobe
  if (!fotoDataUrlOuUrl.startsWith('data:')) return null;

  const blob = dataUrlParaBlob(fotoDataUrlOuUrl);
  const ext = blob.type.includes('png') ? 'png' : blob.type.includes('svg') ? 'svg' : 'jpg';
  const nome = gerarNomeArquivoFoto(ext);

  const { data, error } = await supabaseClient.storage
    .from('fotos')
    .upload(nome, blob, { contentType: blob.type, upsert: false });

  if (error) {
    console.error('Erro ao subir foto:', error);
    throw new Error('Não foi possível subir uma foto: ' + error.message);
  }

  // Pega URL pública
  const { data: urlData } = supabaseClient.storage.from('fotos').getPublicUrl(data.path);
  return urlData.publicUrl;
}

// Salva o checklist completo no Supabase
async function salvarChecklistNoSupabase(dados) {
  if (!supabaseClient) throw new Error('Supabase não inicializado');

  // Sobe fotos primeiro (em paralelo, com Promise.all)
  let fotosUrls = [];
  if (Array.isArray(dados.fotos) && dados.fotos.length > 0) {
    fotosUrls = await Promise.all(dados.fotos.map(f => subirFotoParaStorage(f)));
    fotosUrls = fotosUrls.filter(Boolean);
  }

  // Sobe fotosItens (objeto idx -> dataUrl) — usado no checklist de veículo
  let fotosItensUrls = {};
  if (dados.fotosItens && typeof dados.fotosItens === 'object') {
    const entries = Object.entries(dados.fotosItens);
    const urls = await Promise.all(entries.map(([k, v]) => subirFotoParaStorage(v)));
    entries.forEach(([k], i) => {
      if (urls[i]) fotosItensUrls[k] = urls[i];
    });
  }

  // Sobe assinatura como foto também (é uma dataURL PNG)
  let assinaturaUrl = null;
  if (dados.assinatura) {
    assinaturaUrl = await subirFotoParaStorage(dados.assinatura);
  }

  // Monta o registro a salvar (mapeando camelCase → snake_case do banco)
  const registro = {
    tipo_checklist: dados.tipoChecklist,
    data: dados.data || new Date().toISOString(),
    data_finalizacao: new Date().toISOString(),
    equipe: dados.equipe || null,
    liberado: dados.liberado || null,
    observacao_geral: dados.observacaoGeral || null,
    enviado: false,
    // Equipamento
    colaborador: dados.colaborador || null,
    numero_equipamento: dados.numeroEquipamento || null,
    tipo_equipamento: dados.tipoEquipamento || null,
    // Veículo
    motorista: dados.motorista || null,
    marca: dados.marca || null,
    modelo: dados.modelo || null,
    placa: dados.placa || null,
    tipo_veiculo: dados.tipoVeiculo || null,
    tipo_veiculo_outros: dados.tipoVeiculoOutros || null,
    nivel_combustivel: dados.nivelCombustivel || null,
    local: dados.local || null,
    avarias: dados.avarias || null,
    // JSON
    respostas: dados.respostas || {},
    observacoes_itens: dados.observacoesItens || {},
    fotos_itens: fotosItensUrls,
    fotos: fotosUrls,
    assinatura: assinaturaUrl,
  };

  const { data, error } = await supabaseClient
    .from('checklists')
    .insert(registro)
    .select()
    .single();

  if (error) {
    console.error('Erro ao salvar checklist:', error);
    throw new Error('Não foi possível salvar o checklist: ' + error.message);
  }

  return data;
}

// Lista todos os checklists (mais recentes primeiro) - converte de snake_case → camelCase
function converterDoBanco(linha) {
  return {
    id: linha.id,
    tipoChecklist: linha.tipo_checklist,
    data: linha.data,
    dataFinalizacao: linha.data_finalizacao,
    equipe: linha.equipe || '',
    liberado: linha.liberado || '',
    observacaoGeral: linha.observacao_geral || '',
    enviado: !!linha.enviado,
    colaborador: linha.colaborador || '',
    numeroEquipamento: linha.numero_equipamento || '',
    tipoEquipamento: linha.tipo_equipamento || '',
    motorista: linha.motorista || '',
    marca: linha.marca || '',
    modelo: linha.modelo || '',
    placa: linha.placa || '',
    tipoVeiculo: linha.tipo_veiculo || '',
    tipoVeiculoOutros: linha.tipo_veiculo_outros || '',
    nivelCombustivel: linha.nivel_combustivel || '',
    local: linha.local || '',
    avarias: linha.avarias || '',
    respostas: linha.respostas || {},
    observacoesItens: linha.observacoes_itens || {},
    fotosItens: linha.fotos_itens || {},
    fotos: linha.fotos || [],
    assinatura: linha.assinatura || null,
  };
}

async function listarChecklistsDoSupabase() {
  if (!supabaseClient) throw new Error('Supabase não inicializado');
  const { data, error } = await supabaseClient
    .from('checklists')
    .select('*')
    .order('data', { ascending: false });
  if (error) {
    console.error('Erro ao listar checklists:', error);
    throw new Error('Não foi possível carregar os checklists: ' + error.message);
  }
  return (data || []).map(converterDoBanco);
}

async function apagarChecklistDoSupabase(id) {
  if (!supabaseClient) throw new Error('Supabase não inicializado');
  const { error } = await supabaseClient
    .from('checklists')
    .delete()
    .eq('id', id);
  if (error) {
    console.error('Erro ao apagar checklist:', error);
    throw new Error('Não foi possível apagar: ' + error.message);
  }
}

async function apagarTodosChecklistsDoSupabase() {
  if (!supabaseClient) throw new Error('Supabase não inicializado');
  // Pra apagar todos, fazemos um delete com filtro que sempre é verdadeiro
  const { error } = await supabaseClient
    .from('checklists')
    .delete()
    .gte('id', 0);
  if (error) {
    console.error('Erro ao apagar todos:', error);
    throw new Error('Não foi possível apagar todos: ' + error.message);
  }
}

// Inscreve em mudanças em tempo real (insert, update, delete) na tabela checklists
function escutarMudancasEmTempoReal(callback) {
  if (!supabaseClient) return null;
  const canal = supabaseClient
    .channel('checklists-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'checklists' }, () => {
      callback();
    })
    .subscribe();
  return canal;
}

// HELPERS DE CONFIGURAÇÃO (equipes, equipamentos, itens de veículo)
// Tudo guardado na tabela "configuracoes" (chave/valor JSON).
// ============================================================

// Lê uma configuração (por chave) da tabela "configuracoes".
// Retorna o valor (objeto/array) já parseado, ou null se não existir.
async function lerConfig(chave) {
  if (!supabaseClient) throw new Error('Supabase não inicializado');
  const { data, error } = await supabaseClient
    .from('configuracoes')
    .select('valor')
    .eq('chave', chave)
    .maybeSingle();
  if (error) {
    console.error('Erro ao ler config "' + chave + '":', error);
    throw new Error('Não foi possível ler as configurações: ' + error.message);
  }
  if (!data) return null;
  return data.valor;
}

// Grava (cria ou atualiza) uma configuração na tabela "configuracoes".
async function salvarConfig(chave, valor) {
  if (!supabaseClient) throw new Error('Supabase não inicializado');
  const { error } = await supabaseClient
    .from('configuracoes')
    .upsert({ chave, valor }, { onConflict: 'chave' });
  if (error) {
    console.error('Erro ao salvar config "' + chave + '":', error);
    throw new Error('Não foi possível salvar as configurações: ' + error.message);
  }
}

// Carrega TODAS as configurações do banco para as variáveis globais
// (EQUIPES, EQUIPAMENTOS, CHECKLIST_VEICULOS). Se alguma ainda não existir
// no banco, "semeia" com os valores padrão. Roda no início do app.
async function carregarConfiguracoes() {
  if (USAR_MOCKS || !supabaseClient) return;

  // Equipes
  try {
    const eq = await lerConfig('equipes');
    if (Array.isArray(eq)) {
      EQUIPES = eq;
    } else {
      await salvarConfig('equipes', EQUIPES_PADRAO);
      EQUIPES = JSON.parse(JSON.stringify(EQUIPES_PADRAO));
    }
  } catch (e) {
    console.warn('Falha ao carregar equipes; usando padrão.', e);
  }

  // Equipamentos (com seus itens)
  try {
    const eqp = await lerConfig('equipamentos');
    if (eqp && typeof eqp === 'object') {
      EQUIPAMENTOS = eqp;
    } else {
      await salvarConfig('equipamentos', EQUIPAMENTOS_PADRAO);
      EQUIPAMENTOS = JSON.parse(JSON.stringify(EQUIPAMENTOS_PADRAO));
    }
  } catch (e) {
    console.warn('Falha ao carregar equipamentos; usando padrão.', e);
  }

  // Itens do checklist de veículo
  try {
    const veic = await lerConfig('checklist_veiculos');
    if (veic && veic.secoes) {
      CHECKLIST_VEICULOS = veic;
    } else {
      await salvarConfig('checklist_veiculos', CHECKLIST_VEICULOS_PADRAO);
      CHECKLIST_VEICULOS = JSON.parse(JSON.stringify(CHECKLIST_VEICULOS_PADRAO));
    }
  } catch (e) {
    console.warn('Falha ao carregar itens de veículo; usando padrão.', e);
  }
}

function ChecklistAxialApp() {
  const [tela, setTela] = useState('login');
  const [tipoChecklist, setTipoChecklist] = useState(null); // 'equipamento' ou 'veiculo'
  const [historico, setHistorico] = useState([]);

  // Admin
  const [modoAdmin, setModoAdmin] = useState(false);
  const [checklistsAdmin, setChecklistsAdmin] = useState(USAR_MOCKS ? gerarMocks() : []);
  const [carregandoChecklists, setCarregandoChecklists] = useState(false);
  const [erroChecklists, setErroChecklists] = useState(null);
  const [ultimaAtualizacao, setUltimaAtualizacao] = useState(null);
  const [checklistSelecionado, setChecklistSelecionado] = useState(null);

  const [dados, setDados] = useState(estadoInicialEquipamento());

  // Carrega as configurações (equipes, equipamentos, itens) do banco ao iniciar.
  // Enquanto não carrega, mostramos uma telinha de "carregando".
  const [configCarregada, setConfigCarregada] = useState(USAR_MOCKS || !supabaseClient);
  // contador só pra forçar re-render quando o admin editar as configs
  const [configVersao, setConfigVersao] = useState(0);

  useEffect(() => {
    if (USAR_MOCKS || !supabaseClient) {
      setConfigCarregada(true);
      return;
    }
    let ativo = true;
    carregarConfiguracoes()
      .catch(e => console.warn('Erro ao carregar configurações:', e))
      .finally(() => { if (ativo) setConfigCarregada(true); });
    return () => { ativo = false; };
  }, []);

  // Função reutilizável pra carregar checklists do Supabase
  // (usada tanto no carregamento inicial quanto no botão "Atualizar")
  async function recarregarChecklists(mostrarLoading) {
    if (USAR_MOCKS) return;
    if (mostrarLoading) setCarregandoChecklists(true);
    setErroChecklists(null);
    try {
      const lista = await listarChecklistsDoSupabase();
      setChecklistsAdmin(lista);
      setUltimaAtualizacao(new Date());
    } catch (e) {
      console.error('Falha ao carregar checklists:', e);
      setErroChecklists(e.message || 'Erro desconhecido');
    } finally {
      if (mostrarLoading) setCarregandoChecklists(false);
    }
  }

  // Carrega checklists do Supabase ao entrar no modo admin
  // e fica escutando mudanças em tempo real
  useEffect(() => {
    if (!modoAdmin || USAR_MOCKS) return;

    let canalRealtime = null;

    recarregarChecklists(true);

    // Real-time: recarrega lista quando houver INSERT/UPDATE/DELETE
    canalRealtime = escutarMudancasEmTempoReal(() => {
      recarregarChecklists(false); // sem spinner, atualização silenciosa
    });

    return () => {
      if (canalRealtime && supabaseClient) {
        supabaseClient.removeChannel(canalRealtime);
      }
    };
  }, [modoAdmin]);

  function estadoInicialEquipamento() {
    return {
      tipoChecklist: 'equipamento',
      id: null,
      colaborador: '',
      equipe: '',
      data: new Date().toISOString(),
      numeroEquipamento: '',
      tipoEquipamento: '',
      fotos: [],
      respostas: {},
      observacoesItens: {},
      observacaoGeral: '',
      liberado: '',
      assinatura: null,
      pdfBlob: null,
      enviado: false,
    };
  }

  function estadoInicialVeiculo() {
    return {
      tipoChecklist: 'veiculo',
      id: null,
      motorista: '',
      equipe: '',
      data: new Date().toISOString(),
      marca: '',
      modelo: '',
      placa: '',
      tipoVeiculo: '',
      tipoVeiculoOutros: '',
      nivelCombustivel: '',
      local: LOCAL_FIXO,
      fotos: [], // genéricas, não usadas no fluxo de veículo
      fotosItens: {}, // { idxGlobal: base64dataUrl }
      respostas: {}, // chave é índice global (0 a 42)
      observacoesItens: {},
      observacaoGeral: '',
      avarias: '',
      liberado: '',
      assinatura: null,
      pdfBlob: null,
      enviado: false,
    };
  }

  function novoChecklist() {
    setTela('selecionar_tipo');
  }

  function selecionarTipo(tipo) {
    setTipoChecklist(tipo);
    if (tipo === 'equipamento') {
      setDados(estadoInicialEquipamento());
    } else {
      setDados(estadoInicialVeiculo());
    }
    setTela('identificacao');
  }

  function voltarHome() {
    setDados(estadoInicialEquipamento());
    setTipoChecklist(null);
    // Se está no modo admin, volta pro dashboard. Senão volta pra home do colaborador.
    setTela(modoAdmin ? 'admin_dashboard' : 'home');
  }

  function fazerLogout() {
    setModoAdmin(false);
    setChecklistSelecionado(null);
    setDados(estadoInicialEquipamento());
    setTipoChecklist(null);
    setTela('login');
  }

  function entrarComoColaborador() {
    setModoAdmin(false);
    setTela('home');
  }

  function entrarComoAdmin(senha) {
    if (senha === SENHA_ADMIN) {
      setModoAdmin(true);
      setTela('admin_dashboard');
      return true;
    }
    return false;
  }

  async function adminApagarChecklist(id) {
    if (USAR_MOCKS) {
      setChecklistsAdmin(prev => prev.filter(c => c.id !== id));
      return;
    }
    try {
      await apagarChecklistDoSupabase(id);
      // Atualização otimista (a tela atualiza imediatamente, o real-time faria depois também)
      setChecklistsAdmin(prev => prev.filter(c => c.id !== id));
    } catch (e) {
      alert('Não foi possível apagar o checklist.\n\n' + (e.message || ''));
    }
  }

  async function adminApagarTodos() {
    if (USAR_MOCKS) {
      setChecklistsAdmin([]);
      return;
    }
    try {
      await apagarTodosChecklistsDoSupabase();
      setChecklistsAdmin([]);
    } catch (e) {
      alert('Não foi possível apagar todos os checklists.\n\n' + (e.message || ''));
    }
  }

  function adminVerDetalhes(checklist) {
    setChecklistSelecionado(checklist);
    setTela('admin_detalhes');
  }

  function salvarNoHistorico(dadosFinal) {
    const registro = {
      ...dadosFinal,
      id: Date.now(),
      dataFinalizacao: new Date().toISOString(),
    };
    setHistorico(prev => [registro, ...prev]);
    return registro.id;
  }

  function marcarComoEnviado(id) {
    setHistorico(prev => prev.map(h => h.id === id ? { ...h, enviado: true } : h));
    setDados(d => ({ ...d, enviado: true }));
  }

  return (
    <div style={{
      minHeight: '100vh',
      background: COLORS.gray50,
      fontFamily: "'Inter', -apple-system, BlinkMacSystemFont, sans-serif",
    }}>
      <style>{`

        body { margin: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        .slide-in { animation: slideIn 0.3s ease-out; }
        button:active { transform: scale(0.97); }
        button { transition: all 0.15s ease; }
        input, textarea, select { font-family: inherit; }
        input:focus, textarea:focus, select:focus { outline: 2px solid ${COLORS.accent}; outline-offset: 1px; }
      `}</style>

      {!configCarregada && (
        <div style={{
          minHeight: '100vh', display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center', gap: 16,
          color: COLORS.gray700,
        }}>
          <Spinner />
          <div style={{ fontSize: 15, fontWeight: 600 }}>Carregando configurações…</div>
        </div>
      )}

      {configCarregada && tela === 'login' && (
        <TelaLogin
          onColaborador={entrarComoColaborador}
          onAdmin={entrarComoAdmin}
        />
      )}
      {configCarregada && tela === 'admin_dashboard' && (
        <TelaAdminDashboard
          checklists={checklistsAdmin}
          carregando={carregandoChecklists}
          erro={erroChecklists}
          ultimaAtualizacao={ultimaAtualizacao}
          onAtualizar={() => recarregarChecklists(true)}
          onVerDetalhes={adminVerDetalhes}
          onApagar={adminApagarChecklist}
          onApagarTodos={adminApagarTodos}
          onLogout={fazerLogout}
          onConfiguracoes={() => setTela('admin_config')}
        />
      )}
      {configCarregada && tela === 'admin_config' && (
        <TelaAdminConfig
          onVoltar={() => setTela('admin_dashboard')}
          onAlterado={() => setConfigVersao(v => v + 1)}
        />
      )}
      {tela === 'admin_detalhes' && checklistSelecionado && (
        <TelaFinalizado

          setDados={setDados}
          onProximo={() => setTela('avarias')}
          onVoltar={() => setTela('identificacao')}
        />
      )}
      {tela === 'avarias' && (
        <TelaAvarias
          dados={dados}
          setDados={setDados}
          onProximo={() => setTela('observacoes')}
          onVoltar={() => setTela('checklist')}
        />
      )}
      {tela === 'observacoes' && (
        <TelaObservacoes
          dados={dados}
          setDados={setDados}
          onProximo={() => setTela('assinatura')}
          onVoltar={() => setTela(tipoChecklist === 'veiculo' ? 'avarias' : 'checklist')}
        />
      )}
      {tela === 'assinatura' && (
        <TelaAssinatura
          dados={dados}
          setDados={setDados}
          onFinalizar={async (dadosFinal) => {
            const idLocal = salvarNoHistorico(dadosFinal);
            setDados({ ...dadosFinal, id: idLocal });
            setTela('finalizado');

            // Salva no Supabase em background (não bloqueia a tela "Finalizado")
            if (!USAR_MOCKS && supabaseClient) {
              try {
                await salvarChecklistNoSupabase(dadosFinal);
              } catch (e) {
                console.error('Erro ao salvar no Supabase:', e);
                alert(
                  'O checklist foi finalizado e o PDF está pronto, mas houve um erro ao salvar no servidor.\n\n' +
                  'Detalhes: ' + (e.message || 'desconhecido') + '\n\n' +
                  'Você ainda pode baixar o PDF e compartilhar pelo WhatsApp normalmente.'
                );
              }
            }
          }}
          onVoltar={() => setTela('observacoes')}
        />
      )}
      {tela === 'finalizado' && (
        <TelaFinalizado
          dados={dados}
          onVoltar={voltarHome}
          onMarcarEnviado={marcarComoEnviado}
        />
      )}
    </div>
  );
}

    : EQUIPAMENTOS[registro.tipoEquipamento];
  const data = new Date(registro.data);

  let totalItens, valorNC;
  if (isVeic) {
    totalItens = CHECKLIST_VEICULOS.secoes.reduce((acc, s) => acc + s.itens.length, 0);
    valorNC = 'N';
  } else {
    totalItens = equip ? equip.itens.length : 0;
    valorNC = 'NC';
  }
  const ncs = Object.values(registro.respostas).filter(v => v === valorNC).length;

  const statusCor = registro.liberado === 'sim' ? COLORS.success
                  : registro.liberado === 'nao' ? COLORS.danger

  const tipoNome = isVeic && registro.tipoVeiculo === 'outros'

  const numero = isVeic ? registro.placa : `#${registro.numeroEquipamento}`;

    const e = {};
    if (!dados.colaborador.trim()) e.colaborador = true;
    if (!dados.equipe.trim()) e.equipe = true;
    if (!dados.numeroEquipamento.trim()) e.numeroEquipamento = true;
    if (!dados.tipoEquipamento) e.tipoEquipamento = true;
    setErros(e);
    return Object.keys(e).length === 0;
  }

  function avancar() {
    if (validar()) onProximo();
  }

  function lerQR() {
    // Tenta usar BarcodeDetector nativo

  });

        <Campo label="Equipe" obrigatorio>

            }}
          >
            <option value="">Selecione a equipe…</option>
            {EQUIPES.map(eq => (
              <option key={eq} value={eq}>{eq}</option>
            ))}
          </select>
        </Campo>

        <Campo label="Número do Equipamento" obrigatorio>
          <div style={{ display: 'flex', gap: '8px' }}>
            <Input
              value={dados.numeroEquipamento}
              onChange={e => setDados({ ...dados, numeroEquipamento: e.target.value })}
              placeholder="Nº de série / patrimônio"
              style={erros.numeroEquipamento ? { borderColor: COLORS.danger, flex: 1 } : { flex: 1 }}
            />
            <button
              onClick={lerQR}
              style={{
                background: COLORS.primary,
                color: COLORS.white,
                border: 'none',
                padding: '0 16px',

                alignItems: 'center',

              }}

        </Campo>

        <Campo label="Tipo de Equipamento" obrigatorio>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
            {Object.entries(EQUIPAMENTOS).map(([key, eq]) => {

              return (
                <button

                    padding: '20px 12px',
                    borderRadius: '12px',

          onLer={(codigo) => {
            setDados({ ...dados, numeroEquipamento: codigo });
            setMostrarQR(false);
          }}
          onFechar={() => setMostrarQR(false)}
        />
      )}
    </div>
  );
}

function LeitorQR({ onLer, onFechar }) {
  const videoRef = useRef(null);
  const [erro, setErro] = useState('');

  useEffect(() => {
    let stream = null;
    let intervalo = null;

    async function iniciar() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
        }
        const detector = new window.BarcodeDetector({ formats: ['qr_code', 'code_128', 'code_39', 'ean_13'] });
        intervalo = setInterval(async () => {
          if (videoRef.current && videoRef.current.readyState === 4) {
            try {
              const codigos = await detector.detect(videoRef.current);
              if (codigos.length > 0) {
                clearInterval(intervalo);
                onLer(codigos[0].rawValue);
              }
            } catch (e) { /* ignore */ }
          }
        }, 500);
      } catch (e) {
        setErro('Não foi possível acessar a câmera. Verifique as permissões.');
      }
    }
    iniciar();

    return () => {
      if (intervalo) clearInterval(intervalo);
      if (stream) stream.getTracks().forEach(t => t.stop());
    };
  }, [onLer]);

  return (
    <div style={{
      position: 'fixed', top: 0, left: 0, right: 0, bottom: 0,
      background: 'rgba(0,0,0,0.95)', zIndex: 50,
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
      padding: '20px',
    }}>
      <button onClick={onFechar} style={{
        position: 'absolute', top: 20, right: 20,
        background: 'rgba(255,255,255,0.2)', color: 'white',
        border: 'none', width: 44, height: 44, borderRadius: 22,
        cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
      }}>
        <X size={22} />
      </button>
      {erro ? (
        <div style={{ color: 'white', textAlign: 'center', padding: '24px' }}>
          <AlertCircle size={48} style={{ marginBottom: 12 }} />
          <div>{erro}</div>
        </div>
      ) : (
        <>
          <video ref={videoRef} autoPlay playsInline style={{
            width: '100%', maxWidth: '400px', borderRadius: '12px',
            border: `4px solid ${COLORS.accent}`,
          }} />
          <div style={{ color: 'white', marginTop: 20, textAlign: 'center', fontSize: 15 }}>
            Aponte a câmera para o QR Code do equipamento
          </div>
        </>
      )}
    </div>
  );
}

function TelaFotos({ dados, setDados, onProximo, onVoltar }) {
  const fileInputRef = useRef(null);

  function adicionarFoto(event) {
    const files = Array.from(event.target.files || []);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (e) => {
        // Redimensiona pra economizar memória
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 1200;
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            const ratio = Math.min(maxDim / width, maxDim / height);
            width = Math.round(width * ratio);
            height = Math.round(height * ratio);
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          setDados(d => ({ ...d, fotos: [...d.fotos, dataUrl] }));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
    event.target.value = '';
  }

  function removerFoto(idx) {
    setDados(d => ({ ...d, fotos: d.fotos.filter((_, i) => i !== idx) }));
  }

  return (
    <div className="fade-in">
      <Header titulo="Fotos do Equipamento" onVoltar={onVoltar} etapa={2} totalEtapas={5} />
      <Conteudo>
        <div style={{

          borderRadius: '12px',
          marginBottom: '20px',
          border: `1px solid ${COLORS.gray200}`,
          display: 'flex',
          gap: '12px',
          alignItems: 'center',
        }}>
          <div style={{
            width: 44, height: 44, borderRadius: 10,
            background: COLORS.gray100,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <Camera size={22} color={COLORS.primary} />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: COLORS.gray900 }}>
              {dados.fotos.length} {dados.fotos.length === 1 ? 'foto anexada' : 'fotos anexadas'}
            </div>
            <div style={{ fontSize: 12, color: COLORS.gray500 }}>
              Você pode adicionar quantas precisar (opcional)
            </div>
          </div>
        </div>

        <input
          ref={fileInputRef}
          type="file"
          accept="image/*"
          capture="environment"
          multiple
          onChange={adicionarFoto}
          style={{ display: 'none' }}
        />

        <button
          onClick={() => fileInputRef.current?.click()}
          style={{
            width: '100%',
            background: COLORS.white,
            border: `2px dashed ${COLORS.accent}`,
            padding: '32px 20px',
            borderRadius: '12px',
            cursor: 'pointer',
            display: 'flex',
            flexDirection: 'column',
            alignItems: 'center',
            gap: '10px',
            marginBottom: '20px',
          }}
        >
          <div style={{
            width: 56, height: 56, borderRadius: '50%',
            background: COLORS.accent,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <Camera size={28} color="white" />
          </div>
          <div style={{ fontSize: 16, fontWeight: 700, color: COLORS.gray900 }}>
            Tirar foto / Anexar
          </div>

        {dados.fotos.length > 0 && (

          }}>
            {dados.fotos.map((foto, idx) => (
              <div key={idx} style={{
                position: 'relative',
                aspectRatio: '1',

function TelaChecklist({ dados, setDados, onProximo, onVoltar }) {
  const equip = EQUIPAMENTOS[dados.tipoEquipamento];
  const itens = equip ? equip.itens : [];

  function responder(idx, valor) {
    setDados(d => ({
      ...d,
      respostas: { ...d.respostas, [idx]: valor }
    }));
  }

  function atualizarObs(idx, texto) {
    setDados(d => ({
      ...d,
      observacoesItens: { ...d.observacoesItens, [idx]: texto }
    }));
  }

  const totalRespondidos = Object.keys(dados.respostas).length;
  const percentual = itens.length > 0 ? Math.round((totalRespondidos / itens.length) * 100) : 0;

  const naoRespondidos = itens.filter((_, idx) => !dados.respostas[idx]);

  function avancar() {
    if (naoRespondidos.length > 0) {
      const ok = confirm(`Existem ${naoRespondidos.length} ${naoRespondidos.length === 1 ? 'item não respondido' : 'itens não respondidos'}. Deseja continuar mesmo assim?`);
      if (!ok) return;
    }
    onProximo();
  }

  return (
    <div className="fade-in">
      <Header titulo={equip?.nome || 'Checklist'} onVoltar={onVoltar} etapa={3} totalEtapas={5} />
      <Conteudo>
        {/* Resumo de progresso */}
        <div style={{
          background: COLORS.white,
          padding: '16px',
          borderRadius: '12px',
          marginBottom: '20px',
          border: `1px solid ${COLORS.gray200}`,
        }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
            <span style={{ fontSize: 13, color: COLORS.gray500, fontWeight: 600 }}>
              Progresso
            </span>
            <span style={{ fontSize: 13, fontWeight: 700, color: COLORS.primary }}>
              {totalRespondidos} / {itens.length}
            </span>
          </div>
          <div style={{ height: 8, background: COLORS.gray100, borderRadius: 4, overflow: 'hidden' }}>
            <div style={{
              width: `${percentual}%`,
              height: '100%',
              background: percentual === 100 ? COLORS.success : COLORS.accent,
              transition: 'width 0.3s ease',
            }} />
          </div>
          {/* Estatísticas C/NC/NA */}
          <div style={{ display: 'flex', gap: 12, marginTop: 14, fontSize: 12 }}>
            <span style={{ color: COLORS.success, fontWeight: 700 }}>
              ✓ {Object.values(dados.respostas).filter(v => v === 'C').length} C
            </span>
            <span style={{ color: COLORS.danger, fontWeight: 700 }}>
              ✗ {Object.values(dados.respostas).filter(v => v === 'NC').length} NC
            </span>
            <span style={{ color: COLORS.gray500, fontWeight: 700 }}>
              − {Object.values(dados.respostas).filter(v => v === 'NA').length} NA
            </span>
          </div>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
          {itens.map((item, idx) => (
            <ItemChecklist
              key={idx}
              numero={idx + 1}
              texto={item}
              resposta={dados.respostas[idx]}
              observacao={dados.observacoesItens[idx] || ''}
              onResponder={(v) => responder(idx, v)}
              onObservacao={(t) => atualizarObs(idx, t)}
            />
          ))}
        </div>
      </Conteudo>

      <BarraInferior>
        <BotaoPrimario onClick={avancar}>
          Próximo <ChevronRight size={20} />
        </BotaoPrimario>
      </BarraInferior>
    </div>
  );
}

          borderRadius: '50%',

          alignItems: 'center',
          justifyContent: 'center',
          fontSize: 13,
          fontWeight: 700,

        </div>

          {texto}
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '8px' }}>

        <BotaoResposta
          ativo={resposta === 'NA'}

          fontSize: 12,
          fontWeight: 700,

          padding: '8px 0 0',

        }}

      {mostrarObs && (

            width: '100%',
            marginTop: 6,
            padding: '10px 12px',
            border: `2px solid ${COLORS.gray200}`,
            borderRadius: '8px',
            fontSize: 14,
            resize: 'vertical',
            fontFamily: 'inherit',
          }}
        />
      )}
    </div>
  );
}

function TelaAssinatura({ dados, setDados, onFinalizar, onVoltar }) {
  const canvasRef = useRef(null);
  const [desenhando, setDesenhando] = useState(false);
  const [temAssinatura, setTemAssinatura] = useState(false);
  const [gerando, setGerando] = useState(false);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    // Redimensiona pro DPR pra ficar nítido
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = COLORS.gray900;
    // fundo branco
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, rect.width, rect.height);
  }, []);

  function obterPos(e) {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches?.[0];
    const clientX = touch ? touch.clientX : e.clientX;
    const clientY = touch ? touch.clientY : e.clientY;
    return {
      x: clientX - rect.left,
      y: clientY - rect.top,
    };
  }

  function iniciar(e) {
    e.preventDefault();
    setDesenhando(true);
    const ctx = canvasRef.current.getContext('2d');
    const pos = obterPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function desenhar(e) {
    if (!desenhando) return;
    e.preventDefault();
    const ctx = canvasRef.current.getContext('2d');
    const pos = obterPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    setTemAssinatura(true);
  }

  function parar() {
    setDesenhando(false);
  }

  function limpar() {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const rect = canvas.getBoundingClientRect();
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, rect.width, rect.height);
    setTemAssinatura(false);
  }

  async function finalizar() {
    if (!temAssinatura) {
      alert('Por favor, faça a assinatura antes de finalizar.');
      return;
    }
    setGerando(true);
    const assinaturaDataUrl = canvasRef.current.toDataURL('image/png');
    const dadosFinais = { ...dados, assinatura: assinaturaDataUrl };

    // Gera o PDF
    try {
      const pdfBlob = await gerarPDF(dadosFinais);
      dadosFinais.pdfBlob = pdfBlob;
      onFinalizar(dadosFinais);
    } catch (e) {
      console.error(e);
      alert('Erro ao gerar PDF: ' + e.message);
      setGerando(false);
    }
  }

  return (
    <div className="fade-in">
      <Header titulo="Assinatura Digital" onVoltar={onVoltar} etapa={5} totalEtapas={5} />
      <Conteudo>
        <div style={{
          background: COLORS.white,
          padding: '16px',
          borderRadius: '12px',
          marginBottom: '16px',
          border: `1px solid ${COLORS.gray200}`,
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 4 }}>
            <PenLine size={18} color={COLORS.primary} />
            <span style={{ fontSize: 13, fontWeight: 700, color: COLORS.gray700, textTransform: 'uppercase', letterSpacing: '0.5px' }}>
              {dados.tipoChecklist === 'veiculo' ? 'Motorista do Veículo' : 'Responsável pela Inspeção'}
            </span>
          </div>
          <div style={{ fontSize: 17, fontWeight: 700, color: COLORS.gray900 }}>
            {dados.tipoChecklist === 'veiculo' ? dados.motorista : dados.colaborador}
          </div>
          <div style={{ fontSize: 13, color: COLORS.gray500 }}>
            {dados.equipe}
          </div>
        </div>

        <div style={{ fontSize: 13, color: COLORS.gray700, marginBottom: 10, fontWeight: 600 }}>
          Assine no campo abaixo usando o dedo (ou mouse no computador):
        </div>

        <div style={{
          background: COLORS.white,
          borderRadius: '12px',
          border: `2px solid ${COLORS.gray200}`,
          overflow: 'hidden',
          position: 'relative',
        }}>
          <canvas
            ref={canvasRef}
            onMouseDown={iniciar}
            onMouseMove={desenhar}
            onMouseUp={parar}
            onMouseLeave={parar}
            onTouchStart={iniciar}
            onTouchMove={desenhar}
            onTouchEnd={parar}
            style={{
              width: '100%',
              height: '220px',
              touchAction: 'none',
              display: 'block',
              cursor: 'crosshair',
              background: 'white',
            }}
          />
          {!temAssinatura && (
            <div style={{
              position: 'absolute',
              top: '50%',
              left: '50%',
              transform: 'translate(-50%, -50%)',
              color: COLORS.gray300,
              fontSize: 14,
              fontStyle: 'italic',
              pointerEvents: 'none',
            }}>
              Assine aqui
            </div>
          )}
          <div style={{
            position: 'absolute',
            bottom: 8,
            left: 12,
            right: 12,
            borderTop: `1px dashed ${COLORS.gray200}`,
            pointerEvents: 'none',
          }} />
        </div>

        <button
          onClick={limpar}
          style={{
            marginTop: 10,
            background: 'transparent',
            border: `1px solid ${COLORS.gray300}`,
            color: COLORS.gray700,
            padding: '8px 16px',
            borderRadius: '8px',
            fontSize: 13,
            cursor: 'pointer',
            display: 'flex',
            alignItems: 'center',
            gap: '6px',
            fontWeight: 600,
          }}
        >
          <RotateCcw size={14} /> Limpar
        </button>

        <div style={{
          background: '#EFF6FF',
          border: `1px solid #BFDBFE`,
          padding: '12px 16px',
          borderRadius: 10,
          marginTop: 20,
          fontSize: 13,
          color: '#1E40AF',
          display: 'flex',
          gap: 10,
        }}>
          <CheckCircle2 size={18} style={{ flexShrink: 0, marginTop: 1 }} />
          <div>
            Ao finalizar, será gerado um <strong>PDF profissional</strong> com todos os dados, fotos e sua assinatura digital.
          </div>
        </div>
      </Conteudo>

      <BarraInferior>
        <BotaoPrimario onClick={finalizar} disabled={gerando}>
          {gerando ? 'Gerando PDF...' : (<><CheckCircle2 size={20} /> Finalizar e Gerar PDF</>)}
        </BotaoPrimario>
      </BarraInferior>
    </div>
  );
}

// ============================================================
// HELPERS - Carregamento de jsPDF via CDN
// ============================================================
let _jspdfPromise = null;
function carregarJsPDF() {
  if (window.jspdf) return Promise.resolve(window.jspdf.jsPDF);
  if (_jspdfPromise) return _jspdfPromise;
  _jspdfPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    script.onload = () => resolve(window.jspdf.jsPDF);
    script.onerror = () => reject(new Error('Falha ao carregar jsPDF'));
    document.head.appendChild(script);
  });
  return _jspdfPromise;
}

// ============================================================
// DOWNLOAD/ABERTURA DE PDF COMPATÍVEL COM iOS, ANDROID, DESKTOP
// ============================================================
function ehIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function baixarOuAbrirPDF(blob, nomeArquivo) {
  const url = URL.createObjectURL(blob);
  try {
    if (ehIOS()) {
      // iOS Safari: abre em nova aba, usuário usa "Compartilhar > Salvar em Arquivos"
      // Importante: window.open precisa ser síncrono em relação ao click,
      // mas como já estamos no handler do click, funciona.
      const novaAba = window.open(url, '_blank');
      if (!novaAba) {
        // Pop-up bloqueado: fallback - troca a página atual
        window.location.href = url;
      }
    } else {
      // Desktop e Android: download normal
      const a = document.createElement('a');
      a.href = url;
      a.download = nomeArquivo;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  } finally {
    // Libera memória depois de um tempo (Safari precisa do URL ainda válido)
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }
}

async function gerarPDF(dados) {
  if (dados.tipoChecklist === 'veiculo') {
    return gerarPDFVeiculo(dados);
  }
  return gerarPDFEquipamento(dados);
}

// PDF DE RELATÓRIO CONSOLIDADO (lista de vários checklists para o admin)
// ============================================================
async function gerarPDFRelatorioConsolidado(checklists, filtros) {
  const jsPDF = await carregarJsPDF();
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 40;
  let y = margin;

  function novaPagina() {
    doc.addPage();
    y = margin;
    desenharCabecalho(true);
  }

  function desenharCabecalho(continuacao) {
    // Faixa azul
    doc.setFillColor(11, 37, 69);
    doc.rect(0, 0, pageW, 90, 'F');
    doc.setFillColor(46, 139, 192);
    doc.rect(0, 90, pageW, 4, 'F');

    try {
      doc.addImage(LOGO_AXIAL, 'PNG', margin, 22, 130, 47);
    } catch (e) {
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(20);
      doc.setFont('helvetica', 'bold');
      doc.text('AXIAL', margin, 55);
    }

    doc.setTextColor(255, 255, 255);
    doc.setFontSize(8);
    doc.setFont('helvetica', 'normal');
    doc.text('CONSTRUTORA AXIAL', pageW - margin, 35, { align: 'right' });
    doc.setFontSize(14);
    doc.setFont('helvetica', 'bold');
    doc.text('Relatório Consolidado', pageW - margin, 56, { align: 'right' });
    doc.setFontSize(10);
    doc.setFont('helvetica', 'normal');
    doc.text(continuacao ? 'Continuação' : 'Checklists realizados', pageW - margin, 75, { align: 'right' });

    y = 120;
  }

  function desenharRodape() {
    const total = doc.internal.getNumberOfPages();
    for (let i = 1; i <= total; i++) {
      doc.setPage(i);
      doc.setDrawColor(229, 231, 235);
      doc.setLineWidth(0.5);
      doc.line(margin, pageH - 35, pageW - margin, pageH - 35);
      doc.setTextColor(120, 120, 120);
      doc.setFontSize(7);
      doc.setFont('helvetica', 'normal');
      doc.text(
        'Construtora Axial · Relatório Consolidado · Documento gerado eletronicamente',
        margin, pageH - 22
      );
      doc.text(`Página ${i} de ${total}`, pageW - margin, pageH - 22, { align: 'right' });
    }
  }

  desenharCabecalho(false);

  // ===== Bloco "Dados do Relatório" =====
  doc.setTextColor(11, 37, 69);
  doc.setFontSize(11);
  doc.setFont('helvetica', 'bold');
  doc.text('INFORMAÇÕES DO RELATÓRIO', margin, y);
  y += 16;

  doc.setTextColor(60, 60, 60);
  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  const agora = new Date();
  doc.text(`Data de geração: ${agora.toLocaleString('pt-BR')}`, margin, y);
  y += 12;
  doc.text(`Total de registros: ${checklists.length}`, margin, y);
  y += 12;
  if (filtros && (filtros.busca || filtros.tipo !== 'todos' || filtros.status !== 'todos' || filtros.data)) {
    const partes = [];
    if (filtros.busca) partes.push(`Busca: "${filtros.busca}"`);
    if (filtros.tipo !== 'todos') partes.push(`Tipo: ${filtros.tipo}`);
    if (filtros.status !== 'todos') {
      const stMap = { sim: 'Liberado', nao: 'Não liberado', parcial: 'Com ressalvas' };
      partes.push(`Status: ${stMap[filtros.status] || filtros.status}`);
    }
    if (filtros.data) partes.push(`Data: ${filtros.data}`);
    doc.text(`Filtros aplicados: ${partes.join(' · ')}`, margin, y);
    y += 12;
  }
  y += 8;

  // ===== Totalizadores =====
  const totais = {
    total: checklists.length,
    liberados: checklists.filter(c => c.liberado === 'sim').length,
    bloqueados: checklists.filter(c => c.liberado === 'nao').length,
    parciais: checklists.filter(c => c.liberado === 'parcial').length,
  };

  const boxW = (pageW - 2 * margin - 24) / 4;
  const boxH = 50;
  const boxes = [
    { label: 'TOTAL', valor: totais.total, cor: [11, 37, 69] },
    { label: 'LIBERADOS', valor: totais.liberados, cor: [16, 185, 129] },
    { label: 'BLOQUEADOS', valor: totais.bloqueados, cor: [239, 68, 68] },
    { label: 'C/ RESSALVAS', valor: totais.parciais, cor: [245, 158, 11] },
  ];
  boxes.forEach((b, i) => {
    const x = margin + i * (boxW + 8);
    doc.setFillColor(248, 250, 252);
    doc.setDrawColor(229, 231, 235);
    doc.roundedRect(x, y, boxW, boxH, 4, 4, 'FD');
    doc.setTextColor(...b.cor);
    doc.setFontSize(20);
    doc.setFont('helvetica', 'bold');
    doc.text(String(b.valor), x + boxW / 2, y + 25, { align: 'center' });
    doc.setTextColor(100, 116, 139);
    doc.setFontSize(7);
    doc.setFont('helvetica', 'bold');
    doc.text(b.label, x + boxW / 2, y + 40, { align: 'center' });
  });
  y += boxH + 20;

  // ===== Tabela =====
  doc.setTextColor(11, 37, 69);
  doc.setFontSize(11);
  doc.setFont('helvetica', 'bold');
  doc.text('LISTA DE CHECKLISTS', margin, y);
  y += 14;

  // Cabeçalho da tabela
  const colWidths = [55, 60, 95, 80, 130, 75]; // Data, Tipo, Responsável, Equipe, Identificação, Status
  const headers = ['Data', 'Tipo', 'Responsável', 'Equipe', 'Identificação', 'Status'];
  const tableX = margin;
  let cx = tableX;

  doc.setFillColor(11, 37, 69);
  doc.rect(tableX, y, pageW - 2 * margin, 22, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(8);
  doc.setFont('helvetica', 'bold');
  headers.forEach((h, i) => {
    doc.text(h, cx + 6, y + 14);
    cx += colWidths[i];
  });
  y += 22;

  // Linhas
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8);
  doc.setTextColor(40, 40, 40);

  checklists.forEach((c, idx) => {
    if (y > pageH - 60) {
      novaPagina();
      // Redesenha cabeçalho da tabela na nova página
      doc.setFillColor(11, 37, 69);
      doc.rect(tableX, y, pageW - 2 * margin, 22, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(8);
      doc.setFont('helvetica', 'bold');
      cx = tableX;
      headers.forEach((h, i) => {
        doc.text(h, cx + 6, y + 14);
        cx += colWidths[i];
      });
      y += 22;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.setTextColor(40, 40, 40);
    }

    // Zebra
    if (idx % 2 === 1) {
      doc.setFillColor(248, 250, 252);
      doc.rect(tableX, y, pageW - 2 * margin, 24, 'F');
    }

    const ehVeic = c.tipoChecklist === 'veiculo';
    const nome = ehVeic ? (c.motorista || '-') : (c.colaborador || '-');
    const ident = ehVeic
      ? `${[c.marca, c.modelo].filter(Boolean).join(' ')} · ${(c.placa || '').toUpperCase() || '-'}`
      : (() => {
          const eq = EQUIPAMENTOS[c.tipoEquipamento];
          return `${eq?.nome || c.tipoEquipamento || '-'} · ${c.numeroEquipamento || '-'}`;
        })();
    const dataFmt = new Date(c.data).toLocaleDateString('pt-BR');
    const tipoLabel = ehVeic ? 'Veículo' : 'Equipam.';

    function corta(txt, max) {
      txt = String(txt);
      return txt.length > max ? txt.slice(0, max - 1) + '…' : txt;
    }

    cx = tableX;
    doc.setTextColor(40, 40, 40);
    doc.text(dataFmt, cx + 6, y + 15); cx += colWidths[0];
    doc.text(tipoLabel, cx + 6, y + 15); cx += colWidths[1];
    doc.text(corta(nome, 18), cx + 6, y + 15); cx += colWidths[2];
    doc.text(corta(c.equipe || '-', 16), cx + 6, y + 15); cx += colWidths[3];
    doc.text(corta(ident, 28), cx + 6, y + 15); cx += colWidths[4];

    // Status com badge colorido
    const statusInfo = c.liberado === 'sim'
      ? { cor: [16, 185, 129], label: 'Liberado' }
      : c.liberado === 'nao'
      ? { cor: [239, 68, 68], label: 'Bloqueado' }
      : { cor: [245, 158, 11], label: 'Ressalvas' };
    doc.setFillColor(...statusInfo.cor);
    doc.roundedRect(cx + 4, y + 6, colWidths[5] - 10, 13, 2, 2, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(7);
    doc.text(statusInfo.label, cx + 4 + (colWidths[5] - 10) / 2, y + 15, { align: 'center' });
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);

    // Linha divisória sutil
    doc.setDrawColor(229, 231, 235);
    doc.setLineWidth(0.3);
    doc.line(tableX, y + 24, tableX + (pageW - 2 * margin), y + 24);

    y += 24;
  });

  desenharRodape();

  return doc.output('blob');
}

    doc.setFont('helvetica', 'bold');
    doc.text(String(r.valor), cx, y + 24, { align: 'center' });
    doc.setTextColor(100, 100, 100);
    doc.setFontSize(7);
    doc.setFont('helvetica', 'normal');
    doc.text(r.label, cx, y + 38, { align: 'center' });
  });

  y += 65;

  // ===== Itens do Checklist =====
  doc.setTextColor(11, 37, 69);
  doc.setFontSize(11);
  doc.setFont('helvetica', 'bold');
  doc.text('ITENS VERIFICADOS', margin, y);
  doc.setDrawColor(46, 139, 192);
  doc.line(margin, y + 4, margin + 100, y + 4);
  y += 18;

  if (equip) {
    equip.itens.forEach((item, idx) => {
      const resp = dados.respostas[idx];
      const obs = dados.observacoesItens[idx];

      // Verifica se precisa de nova página
      const alturaItem = 20 + (obs ? 14 : 0);
      if (y + alturaItem > pageH - 60) {
        doc.addPage();
        y = margin;
      }

      // Cor da bolinha
      const cor = resp === 'C' ? [22, 163, 74]
                : resp === 'NC' ? [220, 38, 38]
                : resp === 'NA' ? [100, 116, 139]
                : [203, 213, 225];

      doc.setFillColor(...cor);
      doc.circle(margin + 6, y + 4, 4, 'F');

      doc.setTextColor(20, 20, 20);
      doc.setFontSize(9.5);
      doc.setFont('helvetica', 'normal');
      const textoItem = `${idx + 1}. ${item}`;
      const linhasTexto = doc.splitTextToSize(textoItem, pageW - 2 * margin - 60);
      doc.text(linhasTexto, margin + 18, y + 6);

      // Status à direita
      const statusLabel = resp === 'C' ? 'C' : resp === 'NC' ? 'NC' : resp === 'NA' ? 'NA' : '—';
      doc.setFillColor(...cor);
      doc.roundedRect(pageW - margin - 30, y - 1, 30, 14, 2, 2, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(8);
      doc.setFont('helvetica', 'bold');
      doc.text(statusLabel, pageW - margin - 15, y + 8, { align: 'center' });

      y += linhasTexto.length * 11 + 4;

      if (obs) {
        doc.setTextColor(100, 100, 100);
        doc.setFontSize(8);
        doc.setFont('helvetica', 'italic');
        const linhasObs = doc.splitTextToSize(`Obs: ${obs}`, pageW - 2 * margin - 25);
        doc.text(linhasObs, margin + 18, y);
        y += linhasObs.length * 10 + 4;
      }

      y += 4;
    });
  }

  // ===== Observação Geral =====
  if (dados.observacaoGeral) {
    if (y + 60 > pageH - 60) { doc.addPage(); y = margin; }
    doc.setTextColor(11, 37, 69);
    doc.setFontSize(11);
    doc.setFont('helvetica', 'bold');
    doc.text('OBSERVAÇÕES GERAIS', margin, y);
    doc.setDrawColor(46, 139, 192);
    doc.line(margin, y + 4, margin + 130, y + 4);
    y += 18;

    doc.setTextColor(40, 40, 40);
    doc.setFontSize(10);
    doc.setFont('helvetica', 'normal');
    const linhasObs = doc.splitTextToSize(dados.observacaoGeral, pageW - 2 * margin);
    doc.text(linhasObs, margin, y);
    y += linhasObs.length * 12 + 10;
  }

  // ===== Status de Liberação =====
  if (y + 50 > pageH - 60) { doc.addPage(); y = margin; }

  const corStatus = dados.liberado === 'sim' ? [22, 163, 74]
                  : dados.liberado === 'nao' ? [220, 38, 38]
                  : [234, 88, 12];
  const labelStatus = dados.liberado === 'sim' ? 'EQUIPAMENTO LIBERADO'
                    : dados.liberado === 'nao' ? 'EQUIPAMENTO NÃO LIBERADO'
                    : 'LIBERADO COM OBSERVAÇÃO';

  doc.setFillColor(...corStatus);
  doc.roundedRect(margin, y, pageW - 2 * margin, 38, 6, 6, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(14);
  doc.setFont('helvetica', 'bold');
  doc.text(labelStatus, pageW / 2, y + 24, { align: 'center' });
  y += 52;

  // ===== Fotos (em nova página se muitas) =====
  if (dados.fotos && dados.fotos.length > 0) {
    doc.addPage();
    y = margin;
    doc.setTextColor(11, 37, 69);
    doc.setFontSize(11);
    doc.setFont('helvetica', 'bold');
    doc.text('REGISTRO FOTOGRÁFICO', margin, y);
    doc.setDrawColor(46, 139, 192);
    doc.line(margin, y + 4, margin + 140, y + 4);
    y += 20;

    const fotoW = (pageW - 2 * margin - 10) / 2;
    const fotoH = fotoW * 0.75;
    let col = 0;
    for (let i = 0; i < dados.fotos.length; i++) {
      if (y + fotoH > pageH - 60) {
        doc.addPage();
        y = margin;
      }
      const x = margin + col * (fotoW + 10);
      try {
        doc.addImage(dados.fotos[i], 'JPEG', x, y, fotoW, fotoH);
        doc.setTextColor(100, 100, 100);
        doc.setFontSize(8);
        doc.setFont('helvetica', 'normal');
        doc.text(`Foto ${i + 1}`, x, y + fotoH + 10);
      } catch (e) {
        console.error('Erro ao adicionar foto', e);
      }
      col++;
      if (col >= 2) {
        col = 0;
        y += fotoH + 20;
      }
    }
    if (col > 0) y += fotoH + 20;
  }

  // ===== Assinatura =====
  if (y + 130 > pageH - 60) { doc.addPage(); y = margin; }
  doc.setTextColor(11, 37, 69);
  doc.setFontSize(11);
  doc.setFont('helvetica', 'bold');
  doc.text('ASSINATURA DO RESPONSÁVEL', margin, y);
  doc.setDrawColor(46, 139, 192);
  doc.line(margin, y + 4, margin + 160, y + 4);
  y += 16;

  if (dados.assinatura) {
    try {
      doc.addImage(dados.assinatura, 'PNG', margin, y, 200, 80);
    } catch (e) { console.error(e); }
  }
  y += 85;
  doc.setDrawColor(150, 150, 150);
  doc.setLineWidth(0.5);
  doc.line(margin, y, margin + 220, y);
  doc.setTextColor(40, 40, 40);
  doc.setFontSize(10);
  doc.setFont('helvetica', 'bold');
  doc.text(dados.colaborador, margin, y + 12);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8);
  doc.setTextColor(100, 100, 100);
  doc.text(`${dados.equipe} · ${dataFormatada}`, margin, y + 24);

  // ===== Rodapé em todas as páginas =====
  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setDrawColor(220, 220, 220);
    doc.setLineWidth(0.5);
    doc.line(margin, pageH - 40, pageW - margin, pageH - 40);
    doc.setTextColor(150, 150, 150);
    doc.setFontSize(7);
    doc.setFont('helvetica', 'normal');
    doc.text('Construtora Axial · Checklist de Equipamentos · Documento gerado eletronicamente', margin, pageH - 25);
    doc.text(`Página ${i} de ${pageCount}`, pageW - margin, pageH - 25, { align: 'right' });
  }

  return doc.output('blob');
}

// ============================================================
// TELA 7: FINALIZADO (Compartilhamento)
// ============================================================

function TelaFinalizado({ dados, onVoltar, onMarcarEnviado, modoAdmin }) {
  const isVeic = dados.tipoChecklist === 'veiculo';
  const equip = isVeic
    ? TIPOS_VEICULOS[dados.tipoVeiculo] || { nome: 'Veículo', icone: '🚗' }
    : EQUIPAMENTOS[dados.tipoEquipamento];
  const [statusEnvio, setStatusEnvio] = useState(dados.enviado ? 'enviado' : 'pronto'); // pronto | enviando | enviado
  const [pdfBlobLocal, setPdfBlobLocal] = useState(dados.pdfBlob || null);
  const [gerandoPDF, setGerandoPDF] = useState(false);

  // Se for admin abrindo um checklist que ainda não tem pdfBlob, gera on-the-fly
  useEffect(() => {
    if (modoAdmin && !pdfBlobLocal && !gerandoPDF) {
      setGerandoPDF(true);
      gerarPDF(dados)
        .then(blob => { setPdfBlobLocal(blob); setGerandoPDF(false); })
        .catch(e => {
          console.error('Erro ao gerar PDF on-the-fly:', e);
          setGerandoPDF(false);
        });
    }
  }, [modoAdmin]);

  function nomeArquivo() {
    const data = new Date(dados.data);
    const dataStr = data.toISOString().slice(0, 10);
    if (isVeic) {
      const placa = (dados.placa || 'sem_placa').replace(/[^A-Z0-9]/gi, '');
      return `Checklist_Veiculo_${placa}_${dataStr}.pdf`;
    }
    const equipNome = equip?.nome.replace(/\s+/g, '_') || 'equipamento';
    return `Checklist_${equipNome}_${dados.numeroEquipamento}_${dataStr}.pdf`;
  }

  function baixarPDF() {
    const blob = pdfBlobLocal || dados.pdfBlob;
    if (!blob) return;
    try {
      baixarOuAbrirPDF(blob, nomeArquivo());
    } catch (e) {
      console.error('Erro ao abrir PDF:', e);
      alert('Não foi possível abrir o PDF. Detalhes: ' + (e?.message || e));
    }
  }

  async function enviarParaAdministrador() {
    if (statusEnvio !== 'pronto') return;
    setStatusEnvio('enviando');
    try {
      if (!dados.pdfBlob) {
        throw new Error('PDF ainda não foi gerado. Aguarde alguns segundos e tente novamente.');
      }

      // 1) Dispara o download do PDF para o usuário
      try {
        baixarOuAbrirPDF(dados.pdfBlob, nomeArquivo());
      } catch (e) {
        console.warn('Não foi possível disparar download automático:', e);
      }

      // 2) Monta a mensagem de WhatsApp
      const dataFormatada = new Date(dados.data).toLocaleDateString('pt-BR');
      const statusTxt = dados.liberado === 'sim'
        ? '✅ LIBERADO'
        : dados.liberado === 'nao'
        ? '❌ NÃO LIBERADO'
        : '⚠️ COM RESSALVAS';

      let identificacao = '';
      if (dados.tipoChecklist === 'veiculo') {
        const placa = (dados.placa || '').toUpperCase();
        const marcaModelo = [dados.marca, dados.modelo].filter(Boolean).join(' ');
        identificacao =
          `🚗 *Checklist de Veículo*\n` +
          `Motorista: ${dados.motorista || '-'}\n` +
          `Equipe: ${dados.equipe || '-'}\n` +
          `Veículo: ${marcaModelo || '-'}\n` +
          `Placa: ${placa || '-'}`;
      } else {
        identificacao =
          `🔧 *Checklist de Equipamento*\n` +
          `Colaborador: ${dados.colaborador || '-'}\n` +
          `Equipe: ${dados.equipe || '-'}\n` +
          `Equipamento: ${dados.tipoEquipamento || '-'}\n` +
          `Nº: ${dados.numeroEquipamento || '-'}`;
      }

      const texto =
        `*CHECKLIST AXIAL*\n` +
        `${identificacao}\n` +
        `Data: ${dataFormatada}\n` +
        `Status: ${statusTxt}\n\n` +
        `📎 O PDF do checklist foi baixado no seu dispositivo.\n` +
        `*Anexe o arquivo "${nomeArquivo()}" nesta conversa.*`;

      // 3) Abre o WhatsApp (sem número fixo - usuário escolhe o contato)
      const url = `https://wa.me/?text=${encodeURIComponent(texto)}`;
      window.open(url, '_blank');

      setStatusEnvio('enviado');
      if (onMarcarEnviado) onMarcarEnviado(dados.id);
    } catch (e) {
      console.error('Erro ao compartilhar checklist:', e);
      setStatusEnvio('pronto');
      alert('Não foi possível compartilhar o checklist.\n\nDetalhes técnicos: ' + (e?.message || String(e)));
    }
  }

  const corStatus = dados.liberado === 'sim' ? COLORS.success
                  : dados.liberado === 'nao' ? COLORS.danger
                  : COLORS.warning;

  return (
    <div className="fade-in">
      <div style={{
        background: `linear-gradient(135deg, ${COLORS.primary} 0%, ${COLORS.primaryLight} 100%)`,
        padding: '40px 20px 30px',
        color: 'white',
        textAlign: 'center',
      }}>
        <div style={{
          width: 80, height: 80,
          borderRadius: '50%',
          background: 'rgba(255,255,255,0.15)',
          border: `3px solid ${COLORS.accent}`,
          margin: '0 auto 16px',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
        }}>
          <CheckCircle2 size={44} />
        </div>
        <h1 style={{ fontSize: 24, fontWeight: 800, margin: 0 }}>
          {modoAdmin ? 'Detalhes do Checklist' : 'Checklist Finalizado!'}
        </h1>
        <p style={{ fontSize: 14, margin: '8px 0 0', opacity: 0.85 }}>
          {modoAdmin ? 'Visualização administrativa' : 'PDF gerado com sucesso'}
        </p>
      </div>

      <Conteudo>
        <div style={{
          background: COLORS.white,
          padding: '20px',
          borderRadius: '12px',
          marginBottom: '20px',
          border: `1px solid ${COLORS.gray200}`,
          marginTop: '-15px',
        }}>
          <div style={{ display: 'flex', gap: 14, alignItems: 'center', marginBottom: 16 }}>
            <div style={{
              width: 50, height: 50, borderRadius: 10,
              background: COLORS.gray100,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 24,
            }}>
              {equip?.icone}
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 16, fontWeight: 700, color: COLORS.gray900 }}>
                {isVeic && dados.tipoVeiculo === 'outros'
                  ? (dados.tipoVeiculoOutros || 'Veículo')
                  : equip?.nome}
              </div>
              <div style={{ fontSize: 13, color: COLORS.gray500 }}>
                {isVeic
                  ? `${dados.placa} · ${dados.motorista}`
                  : `#${dados.numeroEquipamento} · ${dados.colaborador}`}
              </div>
            </div>
            <div style={{
              background: corStatus,
              color: 'white',
              padding: '6px 12px',
              borderRadius: 6,
              fontSize: 11,
              fontWeight: 700,
              textTransform: 'uppercase',
              letterSpacing: '0.5px',
            }}>
              {dados.liberado === 'sim' ? 'Liberado'
                : dados.liberado === 'nao' ? 'Reprovado'
                : 'Com ressalvas'}
            </div>
          </div>
          <div style={{
            background: COLORS.gray50,
            padding: '10px 14px',
            borderRadius: 8,
            fontSize: 12,
            color: COLORS.gray700,
            display: 'flex',
            alignItems: 'center',
            gap: 8,
          }}>
            <FileText size={16} color={COLORS.primary} />
            <span style={{ fontWeight: 600 }}>{nomeArquivo()}</span>
          </div>
        </div>

        {/* Feedback de envio */}
        {statusEnvio === 'enviado' && (
          <div style={{
            background: '#ECFDF5',
            border: `1px solid #A7F3D0`,
            borderRadius: 12,
            padding: '14px 16px',
            marginBottom: 16,
            display: 'flex',
            gap: 12,
            alignItems: 'center',
          }} className="fade-in">
            <div style={{
              width: 36, height: 36, borderRadius: '50%',
              background: COLORS.success,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              flexShrink: 0,
            }}>
              <Check size={20} color="white" />
            </div>
            <div>
              <div style={{ fontSize: 14, fontWeight: 700, color: '#065F46' }}>
                Compartilhado no WhatsApp
              </div>
              <div style={{ fontSize: 12, color: '#047857', marginTop: 2 }}>
                O PDF foi baixado e o WhatsApp foi aberto. Lembre-se de anexar o arquivo na conversa.
              </div>
            </div>
          </div>
        )}

        <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', marginBottom: 20 }}>
          <BotaoPrimario onClick={baixarPDF} disabled={gerandoPDF || (!pdfBlobLocal && !dados.pdfBlob)}>
            {gerandoPDF ? (
              <>
                <Spinner /> Gerando PDF...
              </>
            ) : (
              <>
                <Download size={20} /> {ehIOS() ? 'Abrir PDF' : 'Baixar PDF'}
              </>
            )}
          </BotaoPrimario>

          {ehIOS() && (
            <div style={{
              fontSize: 12, color: COLORS.gray600,
              background: '#EFF6FF', border: `1px solid #BFDBFE`,
              padding: '10px 12px', borderRadius: 8,
              display: 'flex', gap: 8, alignItems: 'flex-start',
            }}>
              <span style={{ fontSize: 14 }}>💡</span>
              <div>
                <strong>iOS:</strong> O PDF abrirá em nova aba. Para salvar no celular, toque em <strong>Compartilhar</strong> → <strong>Salvar em Arquivos</strong>.
              </div>
            </div>
          )}

          {!modoAdmin && statusEnvio !== 'enviado' && (
            <button
              onClick={enviarParaAdministrador}
              disabled={statusEnvio === 'enviando'}
              style={{
                background: statusEnvio === 'enviando' ? COLORS.gray300 : '#25D366',
                color: 'white',
                border: 'none',
                padding: '16px 24px',
                borderRadius: '12px',
                fontSize: 16,
                fontWeight: 700,
                cursor: statusEnvio === 'enviando' ? 'wait' : 'pointer',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                gap: '8px',
                width: '100%',
                boxShadow: statusEnvio === 'enviando' ? 'none' : '0 4px 12px rgba(37, 211, 102, 0.3)',
              }}
            >
              {statusEnvio === 'enviando' ? (
                <>
                  <Spinner /> Preparando...
                </>
              ) : (
                <>
                  <Send size={20} /> Compartilhar no WhatsApp
                </>
              )}
            </button>
          )}
        </div>

        <BotaoSecundario onClick={onVoltar}>
          {modoAdmin ? (
            <>
              <ChevronLeft size={20} /> Voltar à Lista
            </>
          ) : (
            <>
              <HomeIcon size={20} /> Voltar ao Início
            </>
          )}
        </BotaoSecundario>
      </Conteudo>
    </div>
  );
}

function Spinner() {
  return (
    <div style={{
      width: 18, height: 18,
      border: '2.5px solid rgba(255,255,255,0.3)',
      borderTopColor: 'white',
      borderRadius: '50%',
      animation: 'spin 0.8s linear infinite',
    }}>
      <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
    </div>
  );
}

// TELA: IDENTIFICAÇÃO DE VEÍCULO

function TelaIdentificacaoVeiculo({ dados, setDados, onProximo, onVoltar }) {
  const [erros, setErros] = useState({});

  function validar() {
    const e = {};
    if (!dados.motorista.trim()) e.motorista = 'Informe o motorista';
    if (!dados.equipe.trim()) e.equipe = 'Informe a equipe';
    if (!dados.marca.trim()) e.marca = 'Informe a marca';
    if (!dados.modelo.trim()) e.modelo = 'Informe o modelo';
    if (!dados.placa.trim()) e.placa = 'Informe a placa';
    if (!dados.tipoVeiculo) e.tipoVeiculo = 'Selecione o tipo';
    if (dados.tipoVeiculo === 'outros' && !dados.tipoVeiculoOutros.trim()) {
      e.tipoVeiculoOutros = 'Especifique o tipo';
    }
    setErros(e);
    return Object.keys(e).length === 0;
  }

  function prosseguir() {
    if (validar()) onProximo();
  }

  function formatarPlaca(valor) {
    const limpo = valor.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (limpo.length <= 3) return limpo;
    return limpo.slice(0, 3) + '-' + limpo.slice(3, 7);
  }

  const niveisCombustivel = [
    { valor: '1/4', label: '1/4', graus: 25 },
    { valor: '1/2', label: '1/2', graus: 50 },
    { valor: '3/4', label: '3/4', graus: 75 },
    { valor: 'cheio', label: 'Cheio', graus: 100 },
  ];

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }} className="fade-in">
      {/* Header com cor de veículo */}
      <div style={{
        background: COLORS.accent, color: 'white',
        padding: '40px 20px 20px',
      }}>
        <button onClick={onVoltar} style={{
          background: 'rgba(255,255,255,0.2)', color: 'white',
          border: 'none', padding: '8px 14px', borderRadius: 8,
          cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6,
          fontSize: 13, fontWeight: 600, marginBottom: 12,
        }}>
          <ChevronLeft size={16} /> Voltar
        </button>
        <h1 style={{ fontSize: 20, fontWeight: 800, margin: 0, display: 'flex', alignItems: 'center', gap: 8 }}>
          <Truck size={22} /> Identificação do Veículo
        </h1>
        <p style={{ fontSize: 13, opacity: 0.9, margin: '4px 0 0' }}>
          Etapa 1 de 5 · Preencha os dados do veículo e motorista
        </p>
      </div>

      <div style={{ flex: 1, padding: 20 }}>
        {/* Local fixo */}
        <div style={{
          background: '#EFF6FF', border: `1px solid #BFDBFE`,
          padding: '12px 14px', borderRadius: 10, marginBottom: 18,
          display: 'flex', alignItems: 'center', gap: 10,
        }}>
          <MapPin size={18} color={COLORS.accent} style={{ flexShrink: 0 }} />
          <div>
            <div style={{ fontSize: 10, fontWeight: 700, color: COLORS.accent, textTransform: 'uppercase', letterSpacing: '0.5px' }}>
              Local de Trabalho
            </div>
            <div style={{ fontSize: 13, color: COLORS.gray800, fontWeight: 600 }}>
              {LOCAL_FIXO}
            </div>
          </div>
        </div>

        {/* Motorista */}
        <CampoVeic
          label="Nome do Motorista"
          obrigatorio
          erro={erros.motorista}
          valor={dados.motorista}
          onChange={v => setDados({ ...dados, motorista: v })}
          placeholder="Ex: João da Silva"
        />

        {/* Equipe */}
        <div style={{ marginBottom: 14 }}>
          <label style={labelEstilo()}>
            Equipe <span style={{ color: COLORS.danger }}>*</span>
          </label>
          <select
            value={dados.equipe}
            onChange={e => setDados({ ...dados, equipe: e.target.value })}
            style={{
              width: '100%',
              padding: '12px 14px',
              border: `2px solid ${erros.equipe ? COLORS.danger : COLORS.gray200}`,
              borderRadius: 10, fontSize: 15,
              background: COLORS.white,
              color: dados.equipe ? COLORS.gray900 : COLORS.gray500,
            }}
          >
            <option value="">Selecione a equipe…</option>
            {EQUIPES.map(eq => (
              <option key={eq} value={eq}>{eq}</option>
            ))}
          </select>
          {erros.equipe && <div style={{ fontSize: 11, color: COLORS.danger, marginTop: 4 }}>{erros.equipe}</div>}
        </div>

        {/* Tipo de Veículo */}
        <div style={{ marginBottom: 18 }}>
          <label style={labelEstilo()}>
            Tipo de Veículo <span style={{ color: COLORS.danger }}>*</span>
          </label>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(120px, 1fr))', gap: 8 }}>

        {dados.tipoVeiculo === 'outros' && (
          <CampoVeic

            valor={dados.tipoVeiculoOutros}

        {/* Marca + Modelo lado a lado */}

          <CampoVeic

            obrigatorio
            erro={erros.marca}
            valor={dados.marca}

            placeholder="Ex: Mercedes"
          />
          <CampoVeic
            label="Modelo"
            obrigatorio
            erro={erros.modelo}
            valor={dados.modelo}
            onChange={v => setDados({ ...dados, modelo: v })}

          />

        {/* Placa */}
        <CampoVeic
          label="Placa do Veículo"

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8 }}>
            {niveisCombustivel.map(n => {
              const ativo = dados.nivelCombustivel === n.valor;
              return (
                <button
                  key={n.valor}
                  onClick={() => setDados({ ...dados, nivelCombustivel: n.valor })}

                    color: ativo ? 'white' : COLORS.gray800,

                  <div style={{
                    width: 28, height: 28, borderRadius: '50%',
                    border: `2px solid ${ativo ? 'white' : COLORS.gray300}`,
                    position: 'relative', overflow: 'hidden',

                  }}>
                    <div style={{
                      position: 'absolute', left: 0, right: 0, bottom: 0,

      {/* Footer fixo */}

        position: 'sticky', bottom: 0,
        background: 'white', borderTop: `1px solid ${COLORS.gray200}`,
        padding: '14px 20px',
      }}>
        <button onClick={prosseguir} style={{
          width: '100%',
          background: COLORS.accent, color: 'white', border: 'none',
          padding: '16px', borderRadius: 12, fontSize: 16, fontWeight: 700,
          cursor: 'pointer', display: 'flex', alignItems: 'center',
          justifyContent: 'center', gap: 8,
          boxShadow: '0 4px 12px rgba(46,139,192,0.3)',
        }}>
          Próximo: Checklist <ChevronRight size={20} />
