  );
}

function CampoVeic({ label, obrigatorio, erro, valor, onChange, placeholder, monospace, maxLength }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <label style={labelEstilo()}>
        {label} {obrigatorio && <span style={{ color: COLORS.danger }}>*</span>}
      </label>
      <input
        type="text"
        value={valor}
        onChange={e => onChange(e.target.value)}
        placeholder={placeholder}
        maxLength={maxLength}
        style={{
          width: '100%',
          padding: '12px 14px',
          border: `2px solid ${erro ? COLORS.danger : COLORS.gray200}`,
          borderRadius: 10, fontSize: 15,
          fontFamily: monospace ? "'Courier New', monospace" : 'inherit',
          fontWeight: monospace ? 700 : 400,
          letterSpacing: monospace ? '1px' : 'normal',
        }}
      />
      {erro && <div style={{ fontSize: 11, color: COLORS.danger, marginTop: 4 }}>{erro}</div>}
    </div>
  );
}

function labelEstilo() {
  return {
    display: 'block', fontSize: 11, fontWeight: 700,
    color: COLORS.gray700, marginBottom: 6,
    textTransform: 'uppercase', letterSpacing: '0.5px',
  };
}

// ============================================================
// TELA: CHECKLIST DE VEÍCULO (43 itens em 3 seções)
// ============================================================
function TelaChecklistVeiculo({ dados, setDados, onProximo, onVoltar }) {
  const [secaoAtual, setSecaoAtual] = useState(0);
  const [erroFinal, setErroFinal] = useState('');
  const [previewIdx, setPreviewIdx] = useState(null); // idxGlobal da foto sendo visualizada
  const secoes = CHECKLIST_VEICULOS.secoes;
  const secao = secoes[secaoAtual];

  // Calcular offset de índice global pra cada seção
  const offsetSecao = secoes.slice(0, secaoAtual).reduce((acc, s) => acc + s.itens.length, 0);

  function responder(idxGlobal, valor) {
    setDados({
      ...dados,
      respostas: { ...dados.respostas, [idxGlobal]: valor },
    });
    setErroFinal('');
  }

  function adicionarFotoItem(idxGlobal, arquivo) {
    if (!arquivo) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      // Comprimir/redimensionar via canvas pra não estourar memória
      const img = new Image();
      img.onload = () => {
        const maxLado = 1200;
        const scale = Math.min(1, maxLado / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
        setDados(d => ({
          ...d,
          fotosItens: { ...d.fotosItens, [idxGlobal]: dataUrl },
        }));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(arquivo);
  }

  function removerFotoItem(idxGlobal) {
    setDados(d => {
      const nova = { ...d.fotosItens };
      delete nova[idxGlobal];
      return { ...d, fotosItens: nova };
    });
    setPreviewIdx(null);
  }

  function progresso() {
    const total = secoes.reduce((acc, s) => acc + s.itens.length, 0);
    const respondidos = Object.keys(dados.respostas).length;
    return { respondidos, total, perc: total > 0 ? (respondidos / total) * 100 : 0 };
  }

  function todosRespondidosNaSecao() {
    for (let i = 0; i < secao.itens.length; i++) {
      const idxGlobal = offsetSecao + i;
      if (!dados.respostas[idxGlobal]) return false;
    }
    return true;
  }

  function todosRespondidos() {
    const total = secoes.reduce((acc, s) => acc + s.itens.length, 0);
    return Object.keys(dados.respostas).length === total;
  }

  function avancarSecao() {
    if (!todosRespondidosNaSecao()) {
      setErroFinal('Responda todos os itens desta seção');
      return;
    }
    setErroFinal('');
    if (secaoAtual < secoes.length - 1) {
      setSecaoAtual(secaoAtual + 1);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      if (todosRespondidos()) {
        onProximo();
      } else {
        setErroFinal('Existem itens sem resposta em outras seções');
      }
    }
  }

  function voltarSecao() {
    if (secaoAtual > 0) {
      setSecaoAtual(secaoAtual - 1);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      onVoltar();
    }
  }

  const prog = progresso();

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }} className="fade-in">
      <div style={{
        background: COLORS.accent, color: 'white',
        padding: '40px 20px 16px',
      }}>
        <button onClick={voltarSecao} style={{
          background: 'rgba(255,255,255,0.2)', color: 'white',
          border: 'none', padding: '8px 14px', borderRadius: 8,
          cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6,
          fontSize: 13, fontWeight: 600, marginBottom: 12,
        }}>
          <ChevronLeft size={16} /> Voltar
        </button>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
          <h1 style={{ fontSize: 18, fontWeight: 800, margin: 0, display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{ fontSize: 22 }}>{secao.icone}</span> {secao.nome}
          </h1>
          <span style={{
            background: 'rgba(255,255,255,0.2)', padding: '4px 10px',
            borderRadius: 12, fontSize: 11, fontWeight: 700,
          }}>
            {secaoAtual + 1} de {secoes.length}
          </span>
        </div>
        <div style={{ fontSize: 12, opacity: 0.9, marginBottom: 10 }}>
          {prog.respondidos} de {prog.total} respondidos · {secao.itens.length} itens nesta seção
        </div>
        {/* Barra de progresso */}
        <div style={{
          height: 6, background: 'rgba(255,255,255,0.2)', borderRadius: 3,
          overflow: 'hidden',
        }}>
          <div style={{
            width: `${prog.perc}%`, height: '100%',
            background: 'white', borderRadius: 3,
            transition: 'width 0.3s ease',
          }} />
        </div>
      </div>

      {/* Legenda */}
      <div style={{
        background: 'white', padding: '10px 20px',
        borderBottom: `1px solid ${COLORS.gray200}`,
        display: 'flex', gap: 14, fontSize: 11, flexWrap: 'wrap',
        justifyContent: 'center', alignItems: 'center',
      }}>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}>
          <span style={{ width: 22, height: 22, borderRadius: 5, background: COLORS.success, color: 'white', fontWeight: 800, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 11 }}>S</span>
          Atende
        </span>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}>
          <span style={{ width: 22, height: 22, borderRadius: 5, background: COLORS.danger, color: 'white', fontWeight: 800, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 11 }}>N</span>
          Não Atende
        </span>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}>
          <span style={{ width: 22, height: 22, borderRadius: 5, background: COLORS.gray400, color: 'white', fontWeight: 800, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 10 }}>NA</span>
          Não Aplicável
        </span>
      </div>

      <div style={{ flex: 1, padding: '16px 16px 100px' }}>
        {secao.itens.map((item, idx) => {
          const idxGlobal = offsetSecao + idx;
          const resp = dados.respostas[idxGlobal];
          const foto = dados.fotosItens[idxGlobal];
          return (
            <div key={idx} style={{
              background: 'white', borderRadius: 12,
              padding: 14, marginBottom: 10,
              border: `1px solid ${resp ? COLORS.gray100 : COLORS.gray200}`,
              boxShadow: '0 1px 3px rgba(0,0,0,0.04)',
            }}>
              <div style={{ display: 'flex', gap: 10, marginBottom: 10 }}>
                <span style={{
                  background: COLORS.gray100, color: COLORS.gray700,
                  width: 26, height: 26, borderRadius: 6,
                  display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                  fontSize: 11, fontWeight: 700, flexShrink: 0,
                }}>
                  {String(idx + 1).padStart(2, '0')}
                </span>
                <span style={{ flex: 1, fontSize: 14, color: COLORS.gray800, lineHeight: 1.4 }}>
                  {item}
                </span>
              </div>

              <div style={{ display: 'flex', gap: 8, alignItems: 'stretch' }}>
                {/* Botões S/N/NA */}
                <div style={{ flex: 1, display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 6 }}>
                  {[
                    { v: 'S', label: 'Atende', cor: COLORS.success },
                    { v: 'N', label: 'Não Atende', cor: COLORS.danger },
                    { v: 'NA', label: 'N/A', cor: COLORS.gray500 },
                  ].map(opt => {
                    const ativo = resp === opt.v;
                    return (
                      <button
                        key={opt.v}
                        onClick={() => responder(idxGlobal, opt.v)}
                        style={{
                          background: ativo ? opt.cor : 'white',
                          color: ativo ? 'white' : opt.cor,
                          border: `2px solid ${opt.cor}`,
                          padding: '10px 4px', borderRadius: 8,
                          cursor: 'pointer', fontSize: 12, fontWeight: 700,
                        }}
                      >
                        <div style={{ fontSize: 14, fontWeight: 800 }}>{opt.v}</div>
                        <div style={{ fontSize: 10, marginTop: 1 }}>{opt.label}</div>
                      </button>
                    );
                  })}
                </div>

                {/* Botão de foto */}
                <div style={{ flexShrink: 0 }}>
                  {foto ? (
                    <button
                      onClick={() => setPreviewIdx(idxGlobal)}
                      style={{
                        width: 54, height: '100%', minHeight: 50,
                        background: 'white',
                        border: `2px solid ${COLORS.accent}`,
                        borderRadius: 8,
                        cursor: 'pointer',
                        overflow: 'hidden',
                        padding: 0,
                        position: 'relative',
                      }}
                      title="Ver foto"
                    >
                      <img
                        src={foto}
                        alt={`Foto item ${idx + 1}`}
                        style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }}
                      />
                      <span style={{
                        position: 'absolute',
                        top: 2, right: 2,
                        background: COLORS.accent,
                        color: 'white',
                        width: 16, height: 16,
                        borderRadius: '50%',
                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                        fontSize: 9, fontWeight: 800,
                      }}>
                        ✓
                      </span>
                    </button>
                  ) : (
                    <label
                      style={{
                        width: 54, height: '100%', minHeight: 50,
                        background: 'white',
                        border: `2px dashed ${COLORS.gray300}`,
                        borderRadius: 8,
                        cursor: 'pointer',
                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                        color: COLORS.gray500,
                      }}
                      title="Adicionar foto (opcional)"
                    >
                      <Camera size={20} />
                      <input
                        type="file"
                        accept="image/*"
                        capture="environment"
                        style={{ display: 'none' }}
                        onChange={e => adicionarFotoItem(idxGlobal, e.target.files?.[0])}
                      />
                    </label>
                  )}
                </div>
              </div>
            </div>
          );
        })}

        {erroFinal && (
          <div style={{
            background: '#FEF2F2', color: COLORS.danger,
            padding: 12, borderRadius: 8, fontSize: 13, fontWeight: 600,
            display: 'flex', alignItems: 'center', gap: 8,
            border: `1px solid #FECACA`,
          }}>
            <AlertCircle size={16} /> {erroFinal}
          </div>
        )}
      </div>

      <div style={{
        position: 'sticky', bottom: 0,
        background: 'white', borderTop: `1px solid ${COLORS.gray200}`,
        padding: '14px 20px',
      }}>
        <button onClick={avancarSecao} style={{
          width: '100%',
          background: COLORS.accent, color: 'white', border: 'none',
          padding: '16px', borderRadius: 12, fontSize: 16, fontWeight: 700,
          cursor: 'pointer', display: 'flex', alignItems: 'center',
          justifyContent: 'center', gap: 8,
          boxShadow: '0 4px 12px rgba(46,139,192,0.3)',
        }}>
          {secaoAtual < secoes.length - 1
            ? <>Próxima Seção <ChevronRight size={20} /></>
            : <>Próximo: Avarias <ChevronRight size={20} /></>}
        </button>
      </div>

      {/* Modal de preview da foto */}
      {previewIdx !== null && dados.fotosItens[previewIdx] && (() => {
        // Achar texto do item
        let textoItem = '';
        let numItem = '';
        let acc = 0;
        for (const s of secoes) {
          for (let i = 0; i < s.itens.length; i++) {
            if (acc === previewIdx) {
              textoItem = s.itens[i];
              numItem = `${s.nome} #${String(i + 1).padStart(2, '0')}`;
              break;
            }
            acc++;
          }
          if (textoItem) break;
        }

        return (
          <div
            onClick={() => setPreviewIdx(null)}
            style={{
              position: 'fixed', inset: 0,
              background: 'rgba(15, 23, 42, 0.85)',
              zIndex: 1000,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              padding: 20,
            }}
          >
            <div
              onClick={e => e.stopPropagation()}
              style={{
                background: 'white', borderRadius: 16,
                maxWidth: 500, width: '100%',
                overflow: 'hidden',
                boxShadow: '0 25px 70px rgba(0,0,0,0.4)',
              }}
              className="fade-in"
            >
              <div style={{
                padding: '14px 16px',
                background: COLORS.accent,
                color: 'white',
                display: 'flex', justifyContent: 'space-between', alignItems: 'center',
              }}>
                <div>
                  <div style={{ fontSize: 10, opacity: 0.85, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '1px' }}>
                    {numItem}
                  </div>
                  <div style={{ fontSize: 13, fontWeight: 700, marginTop: 2 }}>
                    {textoItem}
                  </div>
                </div>
                <button
                  onClick={() => setPreviewIdx(null)}
                  style={{
                    background: 'rgba(255,255,255,0.2)', color: 'white',
                    border: 'none', width: 32, height: 32, borderRadius: 8,
                    cursor: 'pointer', display: 'flex',
                    alignItems: 'center', justifyContent: 'center',
                    flexShrink: 0, marginLeft: 12,
                  }}
                >
                  <X size={16} />
                </button>
              </div>
              <img
                src={dados.fotosItens[previewIdx]}
                alt="Foto do item"
                style={{
                  width: '100%', maxHeight: '60vh',
                  objectFit: 'contain', display: 'block',
                  background: COLORS.gray100,
                }}
              />
              <div style={{ padding: 14, display: 'flex', gap: 10 }}>
                <button
                  onClick={() => removerFotoItem(previewIdx)}
                  style={{
                    flex: 1,
                    background: COLORS.dangerLight, color: COLORS.danger,
                    border: `2px solid ${COLORS.danger}`,
                    padding: '12px', borderRadius: 10,
                    cursor: 'pointer', fontSize: 14, fontWeight: 700,
                    display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
                  }}
                >
                  <Trash2 size={16} /> Remover foto
                </button>
                <button
                  onClick={() => setPreviewIdx(null)}
                  style={{
                    flex: 1,
                    background: COLORS.gray100, color: COLORS.gray700,
                    border: 'none', padding: '12px', borderRadius: 10,
                    cursor: 'pointer', fontSize: 14, fontWeight: 700,
                  }}
                >
                  Fechar
                </button>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

        />

}

// ============================================================
// PDF DE VEÍCULO
// ============================================================
async function gerarPDFVeiculo(dados) {
  const jsPDF = await carregarJsPDF();
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 40;
  let y = margin;

  const tipo = TIPOS_VEICULOS[dados.tipoVeiculo];
  const tipoNome = dados.tipoVeiculo === 'outros'
    ? (dados.tipoVeiculoOutros || 'Outros')
    : tipo?.nome;

  // ===== Cabeçalho =====
  doc.setFillColor(11, 37, 69);
  doc.rect(0, 0, pageW, 80, 'F');
  doc.setFillColor(46, 139, 192);
  doc.rect(0, 80, pageW, 4, 'F');

  try {
    doc.addImage(LOGO_AXIAL, 'PNG', margin, 22, 100, 36);
  } catch (e) {}

  doc.setTextColor(255, 255, 255);
  doc.setFontSize(14);
  doc.setFont('helvetica', 'bold');
  doc.text('CHECKLIST DE VEÍCULO', pageW - margin, 38, { align: 'right' });
  doc.setFontSize(10);
  doc.setFont('helvetica', 'normal');
  doc.text(`${tipoNome}`, pageW - margin, 56, { align: 'right' });
  doc.setFontSize(8);
  doc.text(`Gerado em ${new Date().toLocaleString('pt-BR')}`, pageW - margin, 70, { align: 'right' });

  y = 105;

  // ===== Dados da Identificação =====
  doc.setTextColor(11, 37, 69);
  doc.setFontSize(11);
  doc.setFont('helvetica', 'bold');
  doc.text('IDENTIFICAÇÃO', margin, y);
  y += 6;
  doc.setDrawColor(46, 139, 192);
  doc.setLineWidth(1.5);
  doc.line(margin, y, pageW - margin, y);
  y += 12;

  const linhas = [
    ['Motorista:', dados.motorista, 'Equipe:', dados.equipe],
    ['Marca:', dados.marca, 'Modelo:', dados.modelo],
    ['Placa:', dados.placa, 'Tipo:', tipoNome],
    ['Combustível:', dados.nivelCombustivel === 'cheio' ? 'Cheio' : dados.nivelCombustivel, 'Data:', new Date(dados.data).toLocaleString('pt-BR')],
    ['Local:', dados.local, '', ''],
  ];

  doc.setFontSize(9);
  const colW = (pageW - 2 * margin) / 2;
  linhas.forEach(([l1, v1, l2, v2]) => {
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(100, 116, 139);
    doc.text(l1, margin, y);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(15, 23, 42);
    doc.text(String(v1 || '-'), margin + 70, y);
    if (l2) {
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(100, 116, 139);
      doc.text(l2, margin + colW, y);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(15, 23, 42);
      doc.text(String(v2 || '-'), margin + colW + 60, y);
    }
    y += 14;
  });
  y += 8;

  // ===== Resumo =====
  const total = CHECKLIST_VEICULOS.secoes.reduce((acc, s) => acc + s.itens.length, 0);
  const atende = Object.values(dados.respostas).filter(v => v === 'S').length;
  const naoAtende = Object.values(dados.respostas).filter(v => v === 'N').length;
  const naoAplic = Object.values(dados.respostas).filter(v => v === 'NA').length;

  doc.setFillColor(248, 250, 252);
  doc.rect(margin, y, pageW - 2 * margin, 36, 'F');
  doc.setFontSize(9);
  const colResumo = (pageW - 2 * margin) / 4;
  const resumoItens = [
    { label: 'Total', valor: total, cor: [11, 37, 69] },
    { label: 'Atende', valor: atende, cor: [22, 163, 74] },
    { label: 'Não Atende', valor: naoAtende, cor: [220, 38, 38] },
    { label: 'Não Aplic.', valor: naoAplic, cor: [100, 116, 139] },
  ];
  resumoItens.forEach((r, idx) => {
    const cx = margin + colResumo * idx + colResumo / 2;
    doc.setTextColor(...r.cor);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(16);
    doc.text(String(r.valor), cx, y + 18, { align: 'center' });
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.setTextColor(100, 116, 139);
    doc.text(r.label, cx, y + 30, { align: 'center' });
  });
  y += 50;

  // ===== Status =====
  const statusInfo = dados.liberado === 'sim'
    ? { texto: 'VEÍCULO LIBERADO PARA USO', cor: [22, 163, 74] }
    : dados.liberado === 'nao'
    ? { texto: 'VEÍCULO NÃO LIBERADO', cor: [220, 38, 38] }
    : { texto: 'LIBERADO COM OBSERVAÇÃO', cor: [245, 158, 11] };

  doc.setFillColor(...statusInfo.cor);
  doc.rect(margin, y, pageW - 2 * margin, 26, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(11);
  doc.setFont('helvetica', 'bold');
  doc.text(statusInfo.texto, pageW / 2, y + 17, { align: 'center' });
  y += 40;

  // ===== Itens por seção =====
  CHECKLIST_VEICULOS.secoes.forEach((secao, sIdx) => {
    const offsetSecao = CHECKLIST_VEICULOS.secoes.slice(0, sIdx).reduce((acc, s) => acc + s.itens.length, 0);

    // Quebra de página se necessário
    if (y > pageH - 100) {
      doc.addPage();
      y = margin;
    }

    doc.setTextColor(11, 37, 69);
    doc.setFontSize(10);
    doc.setFont('helvetica', 'bold');
    doc.text(`${secao.nome} (${secao.itens.length})`, margin, y);
    y += 4;
    doc.setDrawColor(46, 139, 192);
    doc.setLineWidth(1);
    doc.line(margin, y, pageW - margin, y);
    y += 12;

    doc.setFontSize(8.5);
    secao.itens.forEach((item, iIdx) => {
      if (y > pageH - 40) {
        doc.addPage();
        y = margin;
      }
      const idxGlobal = offsetSecao + iIdx;
      const resp = dados.respostas[idxGlobal];
      const temFoto = !!dados.fotosItens?.[idxGlobal];
      const corResp = resp === 'S' ? [22, 163, 74]
                    : resp === 'N' ? [220, 38, 38]
                    : resp === 'NA' ? [100, 116, 139]
                    : [203, 213, 225];

      // Quadradinho colorido
      doc.setFillColor(...corResp);
      doc.rect(margin, y - 8, 22, 11, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(8);
      doc.text(resp || '-', margin + 11, y - 0.5, { align: 'center' });

      // Texto do item
      doc.setTextColor(15, 23, 42);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8.5);
      const larguraTextoMax = pageW - 2 * margin - 30 - (temFoto ? 26 : 0);
      const linhas = doc.splitTextToSize(`${iIdx + 1}. ${item}`, larguraTextoMax);
      doc.text(linhas, margin + 28, y);

      // Thumbnail da foto (se existir)
      if (temFoto) {
        try {
          doc.addImage(
            dados.fotosItens[idxGlobal],
            'JPEG',
            pageW - margin - 22,
            y - 8,
            22, 18
          );
          // Bordinha
          doc.setDrawColor(46, 139, 192);
          doc.setLineWidth(0.5);
          doc.rect(pageW - margin - 22, y - 8, 22, 18);
        } catch (e) {}
      }

      y += Math.max(linhas.length * 10, temFoto ? 14 : 0) + 4;
    });
    y += 8;
  });

  // ===== Avarias =====
  if (dados.avarias) {
    if (y > pageH - 100) {
      doc.addPage();
      y = margin;
    }
    doc.setFillColor(254, 242, 242);
    const linhasAv = doc.splitTextToSize(dados.avarias, pageW - 2 * margin - 20);
    const altura = 40 + linhasAv.length * 11;
    doc.rect(margin, y, pageW - 2 * margin, altura, 'F');
    doc.setDrawColor(220, 38, 38);
    doc.setLineWidth(2);
    doc.line(margin, y, margin, y + altura);
    doc.setTextColor(127, 29, 29);
    doc.setFontSize(9);
    doc.setFont('helvetica', 'bold');
    doc.text('⚠ AVARIAS NA CARROCERIA', margin + 10, y + 16);
    doc.setFontSize(8);
    doc.setFont('helvetica', 'italic');
    doc.text('Legenda: M = Morsa · A = Amassado/Arranhado', margin + 10, y + 28);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8.5);
    doc.text(linhasAv, margin + 10, y + 40);
    y += altura + 12;
  }

  // ===== Observação geral =====
  if (dados.observacaoGeral) {
    if (y > pageH - 80) {
      doc.addPage();
      y = margin;
    }
    doc.setFillColor(255, 251, 235);
    const linhasObs = doc.splitTextToSize(dados.observacaoGeral, pageW - 2 * margin - 20);
    const altura = 26 + linhasObs.length * 11;
    doc.rect(margin, y, pageW - 2 * margin, altura, 'F');
    doc.setDrawColor(245, 158, 11);
    doc.setLineWidth(2);
    doc.line(margin, y, margin, y + altura);
    doc.setTextColor(146, 64, 14);
    doc.setFontSize(9);
    doc.setFont('helvetica', 'bold');
    doc.text('OBSERVAÇÃO GERAL', margin + 10, y + 16);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8.5);
    doc.text(linhasObs, margin + 10, y + 30);
    y += altura + 12;
  }

  // ===== Fotos dos itens (página separada com legendas) =====
  const fotosPorItem = dados.fotosItens || {};
  const idsComFoto = Object.keys(fotosPorItem).map(Number).sort((a, b) => a - b);

  // Helper: pega texto e seção de um item pelo índice global
  function infoItem(idxGlobal) {
    let acc = 0;
    for (const s of CHECKLIST_VEICULOS.secoes) {
      for (let i = 0; i < s.itens.length; i++) {
        if (acc === idxGlobal) return { texto: s.itens[i], secao: s.nome, num: i + 1 };
        acc++;
      }
    }
    return { texto: '', secao: '', num: 0 };
  }

  if (idsComFoto.length > 0) {
    doc.addPage();
    y = margin;
    doc.setTextColor(11, 37, 69);
    doc.setFontSize(12);
    doc.setFont('helvetica', 'bold');
    doc.text('REGISTROS FOTOGRÁFICOS POR ITEM', margin, y);
    y += 6;
    doc.setDrawColor(46, 139, 192);
    doc.setLineWidth(1.5);
    doc.line(margin, y, pageW - margin, y);
    y += 14;
    doc.setFontSize(8);
    doc.setTextColor(100, 116, 139);
    doc.setFont('helvetica', 'italic');
    doc.text(`${idsComFoto.length} ${idsComFoto.length === 1 ? 'foto anexada' : 'fotos anexadas'} pelo motorista`, margin, y);
    y += 16;

    const fotoW = (pageW - 2 * margin - 16) / 2;
    const fotoH = 140;
    const legendaH = 36;
    const blocoH = fotoH + legendaH + 14;
    let col = 0;

    idsComFoto.forEach((idxGlobal) => {
      if (col === 0 && y + blocoH > pageH - margin) {
        doc.addPage();
        y = margin;
      }
      const x = margin + col * (fotoW + 16);
      const info = infoItem(idxGlobal);
      const resp = dados.respostas[idxGlobal];
      const corResp = resp === 'S' ? [22, 163, 74]
                    : resp === 'N' ? [220, 38, 38]
                    : resp === 'NA' ? [100, 116, 139]
                    : [203, 213, 225];

      // Foto
      try {
        doc.addImage(fotosPorItem[idxGlobal], 'JPEG', x, y, fotoW, fotoH);
      } catch (e) {}
      doc.setDrawColor(226, 232, 240);
      doc.setLineWidth(0.5);
      doc.rect(x, y, fotoW, fotoH);

      // Bloco de legenda
      doc.setFillColor(248, 250, 252);
      doc.rect(x, y + fotoH, fotoW, legendaH, 'F');

      // Tag de seção
      doc.setFillColor(46, 139, 192);
      doc.rect(x + 6, y + fotoH + 6, 50, 12, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(7);
      doc.text(info.secao, x + 31, y + fotoH + 14, { align: 'center' });

      // Resposta
      doc.setFillColor(...corResp);
      doc.rect(x + 60, y + fotoH + 6, 18, 12, 'F');
      doc.setTextColor(255, 255, 255);
      doc.text(resp || '-', x + 69, y + fotoH + 14, { align: 'center' });

      // Número do item
      doc.setTextColor(100, 116, 139);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(7);
      doc.text(`Item ${String(info.num).padStart(2, '0')}`, x + 84, y + fotoH + 14);

      // Texto do item
      doc.setTextColor(15, 23, 42);
      doc.setFontSize(8);
      const textoLinhas = doc.splitTextToSize(info.texto, fotoW - 12);
      doc.text(textoLinhas.slice(0, 2), x + 6, y + fotoH + 26);

      col++;
      if (col >= 2) {
        col = 0;
        y += blocoH;
      }
    });
    if (col === 1) y += blocoH;
  }

  // ===== Assinatura =====
  if (dados.assinatura) {
    if (y > pageH - 130) {
      doc.addPage();
      y = margin;
    }
    doc.setTextColor(11, 37, 69);
    doc.setFontSize(11);
    doc.setFont('helvetica', 'bold');
    doc.text('ASSINATURA DO MOTORISTA', margin, y);
    y += 6;
    doc.setDrawColor(46, 139, 192);
    doc.line(margin, y, pageW - margin, y);
    y += 14;

    try {
      doc.addImage(dados.assinatura, 'PNG', margin, y, 200, 70);
    } catch (e) {}
    doc.setDrawColor(15, 23, 42);
    doc.setLineWidth(0.5);
    doc.line(margin, y + 75, margin + 200, y + 75);
    doc.setFontSize(8);
    doc.setTextColor(100, 116, 139);
    doc.text(dados.motorista, margin, y + 86);
    doc.text(new Date(dados.data).toLocaleString('pt-BR'), margin, y + 96);
    y += 110;
  }

  // ===== Rodapé em todas as páginas =====
  const total_pag = doc.internal.getNumberOfPages();
  for (let i = 1; i <= total_pag; i++) {
    doc.setPage(i);
    doc.setFontSize(7);
    doc.setTextColor(148, 163, 184);
    doc.text(`Construtora Axial · Checklist de Veículo · Página ${i} de ${total_pag}`,
      pageW / 2, pageH - 18, { align: 'center' });
  }

  return doc.output('blob');
}

// TELA: ADMIN DASHBOARD (lista de todos os checklists)

function TelaAdminDashboard({ checklists, carregando, erro, ultimaAtualizacao, onAtualizar, onVerDetalhes, onApagar, onApagarTodos, onLogout, onConfiguracoes }) {
  const [busca, setBusca] = useState('');
  const [filtroTipo, setFiltroTipo] = useState('todos'); // todos | equipamento | veiculo
  const [filtroStatus, setFiltroStatus] = useState('todos'); // todos | sim | nao | parcial
  const [filtroData, setFiltroData] = useState(''); // YYYY-MM-DD
  const [gerandoPDFGeral, setGerandoPDFGeral] = useState(false);

  function nomeDoResponsavel(c) {
    return c.tipoChecklist === 'veiculo' ? (c.motorista || '-') : (c.colaborador || '-');
  }

  function identificacao(c) {
    if (c.tipoChecklist === 'veiculo') {
      const placa = (c.placa || '').toUpperCase();
      return `${[c.marca, c.modelo].filter(Boolean).join(' ')} · ${placa || '-'}`;
    }
    return `${c.tipoEquipamento || '-'} · ${c.numeroEquipamento || '-'}`;
  }

  const filtrados = checklists.filter(c => {
    if (filtroTipo !== 'todos' && c.tipoChecklist !== filtroTipo) return false;
    if (filtroStatus !== 'todos' && c.liberado !== filtroStatus) return false;
    if (filtroData && !c.data.startsWith(filtroData)) return false;
    if (busca) {
      const txt = busca.toLowerCase();
      const conteudo = [
        nomeDoResponsavel(c), c.equipe, identificacao(c),
      ].join(' ').toLowerCase();
      if (!conteudo.includes(txt)) return false;
    }
    return true;
  });

  function confirmarApagar(id) {
    if (window.confirm('Tem certeza que deseja apagar este checklist? Esta ação não pode ser desfeita.')) {
      onApagar(id);
    }
  }

  function confirmarApagarTodos() {
    if (checklists.length === 0) return;
    if (window.confirm(`Tem certeza que deseja apagar TODOS os ${checklists.length} checklists? Esta ação não pode ser desfeita.`)) {
      if (window.confirm('Confirma a exclusão de TODOS os registros?')) {
        onApagarTodos();
      }
    }
  }

  function exportarCSV() {
    if (checklists.length === 0) {
      alert('Não há checklists para exportar.');
      return;
    }
    const cabecalho = [
      'ID', 'Tipo', 'Data', 'Responsável', 'Equipe', 'Identificação', 'Status', 'Observações', 'Avarias',
    ];
    const linhas = filtrados.map(c => [
      c.id,
      c.tipoChecklist === 'veiculo' ? 'Veículo' : 'Equipamento',
      new Date(c.data).toLocaleString('pt-BR'),
      nomeDoResponsavel(c),
      c.equipe || '',
      identificacao(c),
      c.liberado === 'sim' ? 'Liberado' : c.liberado === 'nao' ? 'Não liberado' : c.liberado === 'parcial' ? 'Com ressalvas' : '-',
      (c.observacaoGeral || '').replace(/\n/g, ' '),
      (c.avarias || '').replace(/\n/g, ' '),
    ]);
    const csv = [cabecalho, ...linhas]
      .map(linha => linha.map(v => `"${String(v).replace(/"/g, '""')}"`).join(','))
      .join('\n');
    // BOM pra Excel reconhecer UTF-8
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const dt = new Date().toISOString().slice(0, 10);
    a.download = `relatorio_checklists_${dt}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function exportarPDF() {
    if (filtrados.length === 0) {
      alert('Não há checklists para exportar.');
      return;
    }
    if (gerandoPDFGeral) return;
    setGerandoPDFGeral(true);
    try {
      const blob = await gerarPDFRelatorioConsolidado(filtrados, {
        busca, tipo: filtroTipo, status: filtroStatus, data: filtroData,
      });
      const dt = new Date().toISOString().slice(0, 10);
      baixarOuAbrirPDF(blob, `relatorio_checklists_${dt}.pdf`);
    } catch (e) {
      console.error('Erro ao gerar PDF consolidado:', e);
      alert('Não foi possível gerar o PDF.\n\nDetalhes: ' + (e?.message || String(e)));
    } finally {
      setGerandoPDFGeral(false);
    }
  }

        padding: '24px 20px 32px',

              </div>
              <div>

                </div>

            </div>
            <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>

              <button

function TelaAdminConfig({ onVoltar, onAlterado }) {
  const [aba, setAba] = useState('equipes'); // equipes | equipamentos | veiculo

  // Estados locais (cópias editáveis do que está em memória)

  const [mensagem, setMensagem] = useState(null); // { tipo: 'ok'|'erro', texto }

  function avisar(tipo, texto) {
    setMensagem({ tipo, texto });
    setTimeout(() => setMensagem(null), 4000);
  }

  // ---------- Salvar cada bloco no Supabase ----------
  async function salvarEquipes(novaLista) {
    setSalvando(true);

      await salvarConfig('equipes', novaLista);

// ---------------- ABA: EQUIPES ----------------
function AbaEquipes({ equipes, salvando, onSalvar }) {
  const [lista, setLista] = useState(() => [...equipes]);
  const [nova, setNova] = useState('');
  const [editIdx, setEditIdx] = useState(null);
  const [editTexto, setEditTexto] = useState('');

  function adicionar() {
    const nome = nova.trim();
    if (!nome) return;
    if (lista.some(e => e.toLowerCase() === nome.toLowerCase())) {
      alert('Essa equipe já existe.');
      return;
    }
    setLista([...lista, nome]);
    setNova('');
  }

  function remover(idx) {
    if (!window.confirm(`Remover a equipe "${lista[idx]}"?`)) return;
    setLista(lista.filter((_, i) => i !== idx));
  }

  function iniciarEdicao(idx) {
    setEditIdx(idx);
    setEditTexto(lista[idx]);
  }

  function confirmarEdicao() {
    const nome = editTexto.trim();
    if (!nome) return;
    setLista(lista.map((e, i) => i === editIdx ? nome : e));
    setEditIdx(null);
    setEditTexto('');
  }

  const houveMudanca = JSON.stringify(lista) !== JSON.stringify(equipes);

  return (
    <div style={{ background: COLORS.white, border: `1px solid ${COLORS.gray200}`, borderRadius: 12, padding: 20 }}>
      <h3 style={{ margin: '0 0 4px', fontSize: 17, fontWeight: 800, color: COLORS.gray900 }}>Equipes</h3>
      <p style={{ margin: '0 0 16px', fontSize: 13, color: COLORS.gray500 }}>
        Estas equipes aparecem como opções para o colaborador escolher ao iniciar um checklist.
      </p>

      {/* Adicionar nova */}
      <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
        <input
          type="text"
          value={nova}
          onChange={e => setNova(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter') adicionar(); }}
          placeholder="Ex: EQUIPE 500T"
          style={{
            flex: 1, padding: '12px 14px', border: `2px solid ${COLORS.gray200}`,
            borderRadius: 10, fontSize: 15,
          }}
        />
        <button onClick={adicionar} style={btnPrimarioConfig()}>
          <PlusCircle size={18} /> Adicionar
        </button>
      </div>

      {/* Lista */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {lista.length === 0 && (
          <div style={{ fontSize: 14, color: COLORS.gray500, padding: 12, textAlign: 'center' }}>
            Nenhuma equipe cadastrada.
          </div>
        )}
        {lista.map((eq, idx) => (
          <div key={idx} style={{
            display: 'flex', alignItems: 'center', gap: 8,
            background: COLORS.gray50, border: `1px solid ${COLORS.gray200}`,
            borderRadius: 10, padding: '10px 12px',
          }}>
            {editIdx === idx ? (
              <>
                <input
                  type="text"
                  value={editTexto}
                  onChange={e => setEditTexto(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') confirmarEdicao(); }}
                  autoFocus
                  style={{ flex: 1, padding: '8px 10px', border: `2px solid ${COLORS.accent}`, borderRadius: 8, fontSize: 15 }}
                />
                <button onClick={confirmarEdicao} style={btnIconeConfig(COLORS.success)} title="Confirmar">
                  <Check size={16} />
                </button>
                <button onClick={() => setEditIdx(null)} style={btnIconeConfig(COLORS.gray500)} title="Cancelar">
                  <X size={16} />
                </button>
              </>
            ) : (
              <>
                <span style={{ flex: 1, fontSize: 15, fontWeight: 600, color: COLORS.gray900 }}>{eq}</span>
                <button onClick={() => iniciarEdicao(idx)} style={btnIconeConfig(COLORS.accent)} title="Editar">
                  <Edit size={16} />
                </button>
                <button onClick={() => remover(idx)} style={btnIconeConfig(COLORS.danger)} title="Remover">
                  <Trash2 size={16} />
                </button>
              </>
            )}
          </div>
        ))}
      </div>

      {/* Salvar */}
      <div style={{ marginTop: 20, display: 'flex', justifyContent: 'flex-end' }}>
        <button
          onClick={() => onSalvar(lista)}
          disabled={salvando || !houveMudanca}
          style={btnSalvarConfig(salvando || !houveMudanca)}
        >
          {salvando ? <><Spinner /> Salvando…</> : <><Save size={18} /> Salvar equipes</>}
        </button>
      </div>
    </div>
  );
}

// ---------------- ABA: EQUIPAMENTOS ----------------
function AbaEquipamentos({ equipamentos, salvando, onSalvar }) {
  // trabalhamos com um array de [chave, obj] para facilitar a edição
  const [lista, setLista] = useState(() =>
    Object.entries(JSON.parse(JSON.stringify(equipamentos)))
  );
  const [expandido, setExpandido] = useState(null); // chave do equipamento aberto

  // Para adicionar novo equipamento
  const [novoNome, setNovoNome] = useState('');
  const [novoIcone, setNovoIcone] = useState('🔧');

  function adicionarEquipamento() {
    const nome = novoNome.trim();
    if (!nome) return;
    let chave = gerarChaveEquip(nome);
    // garante chave única
    let i = 2;
    const existentes = lista.map(([k]) => k);
    while (existentes.includes(chave)) { chave = gerarChaveEquip(nome) + '_' + i; i++; }
    const novo = [chave, { nome, icone: novoIcone || '🔧', itens: ['Outros itens'] }];
    setLista([...lista, novo]);
    setNovoNome('');
    setNovoIcone('🔧');
    setExpandido(chave);
  }

  function removerEquipamento(chave) {
    const obj = lista.find(([k]) => k === chave);
    if (!obj) return;
    if (!window.confirm(`Remover o equipamento "${obj[1].nome}" e todos os seus itens?`)) return;
    setLista(lista.filter(([k]) => k !== chave));
    if (expandido === chave) setExpandido(null);
  }

  function atualizarCampo(chave, campo, valor) {
    setLista(lista.map(([k, v]) => k === chave ? [k, { ...v, [campo]: valor }] : [k, v]));
  }

  // ----- itens de um equipamento -----
  function addItem(chave) {
    setLista(lista.map(([k, v]) => {
      if (k !== chave) return [k, v];
      return [k, { ...v, itens: [...(v.itens || []), ''] }];
    }));
  }
  function editItem(chave, idx, texto) {
    setLista(lista.map(([k, v]) => {
      if (k !== chave) return [k, v];
      const itens = [...v.itens];
      itens[idx] = texto;
      return [k, { ...v, itens }];
    }));
  }
  function removeItem(chave, idx) {
    setLista(lista.map(([k, v]) => {
      if (k !== chave) return [k, v];
      return [k, { ...v, itens: v.itens.filter((_, i) => i !== idx) }];
    }));
  }
  function moverItem(chave, idx, dir) {
    setLista(lista.map(([k, v]) => {
      if (k !== chave) return [k, v];
      const itens = [...v.itens];
      const novoIdx = idx + dir;
      if (novoIdx < 0 || novoIdx >= itens.length) return [k, v];
      [itens[idx], itens[novoIdx]] = [itens[novoIdx], itens[idx]];
      return [k, { ...v, itens }];
    }));
  }

  function salvar() {
    // valida: nomes preenchidos, itens não vazios
    for (const [k, v] of lista) {
      if (!v.nome || !v.nome.trim()) { alert('Todo equipamento precisa de um nome.'); return; }
      const itensLimpos = (v.itens || []).map(it => (it || '').trim()).filter(Boolean);
      if (itensLimpos.length === 0) { alert(`O equipamento "${v.nome}" precisa de pelo menos um item.`); return; }
    }
    // monta objeto final, limpando itens vazios
    const obj = {};
    lista.forEach(([k, v]) => {
      obj[k] = {
        nome: v.nome.trim(),
        icone: v.icone || '🔧',
        itens: (v.itens || []).map(it => (it || '').trim()).filter(Boolean),
      };
    });
    onSalvar(obj);
  }

  const houveMudanca = JSON.stringify(Object.fromEntries(lista)) !== JSON.stringify(equipamentos);

  return (
    <div style={{ background: COLORS.white, border: `1px solid ${COLORS.gray200}`, borderRadius: 12, padding: 20 }}>
      <h3 style={{ margin: '0 0 4px', fontSize: 17, fontWeight: 800, color: COLORS.gray900 }}>Equipamentos</h3>
      <p style={{ margin: '0 0 16px', fontSize: 13, color: COLORS.gray500 }}>
        Cada equipamento tem seu próprio checklist (lista de itens). Toque num equipamento para editar os itens.
      </p>

      {/* Adicionar novo */}
      <div style={{
        display: 'flex', gap: 8, marginBottom: 16, flexWrap: 'wrap',
        background: COLORS.gray50, padding: 12, borderRadius: 10, border: `1px dashed ${COLORS.gray300}`,
      }}>
        <input
          type="text"
          value={novoIcone}
          onChange={e => setNovoIcone(e.target.value)}
          maxLength={2}
          placeholder="🔧"
          title="Emoji/ícone"
          style={{ width: 56, textAlign: 'center', padding: '12px 8px', border: `2px solid ${COLORS.gray200}`, borderRadius: 10, fontSize: 18 }}
        />
        <input
          type="text"
          value={novoNome}
          onChange={e => setNovoNome(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter') adicionarEquipamento(); }}
          placeholder="Nome do novo equipamento (ex: Compressor de Ar)"
          style={{ flex: 1, minWidth: 180, padding: '12px 14px', border: `2px solid ${COLORS.gray200}`, borderRadius: 10, fontSize: 15 }}
        />
        <button onClick={adicionarEquipamento} style={btnPrimarioConfig()}>
          <PlusCircle size={18} /> Adicionar
        </button>
      </div>

      {/* Lista de equipamentos */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        {lista.length === 0 && (
          <div style={{ fontSize: 14, color: COLORS.gray500, padding: 12, textAlign: 'center' }}>
            Nenhum equipamento cadastrado.
          </div>
        )}
        {lista.map(([chave, eq]) => {
          const aberto = expandido === chave;
          return (
            <div key={chave} style={{ border: `1px solid ${COLORS.gray200}`, borderRadius: 10, overflow: 'hidden' }}>
              {/* Cabeçalho do equipamento */}
              <div style={{
                display: 'flex', alignItems: 'center', gap: 10, padding: '12px 14px',
                background: aberto ? COLORS.gray50 : COLORS.white,
              }}>
                <span style={{ fontSize: 24 }}>{eq.icone}</span>
                <input
                  type="text"
                  value={eq.nome}
                  onChange={e => atualizarCampo(chave, 'nome', e.target.value)}
                  style={{ flex: 1, padding: '8px 10px', border: `1.5px solid ${COLORS.gray200}`, borderRadius: 8, fontSize: 15, fontWeight: 700 }}
                />
                <input
                  type="text"
                  value={eq.icone}
                  onChange={e => atualizarCampo(chave, 'icone', e.target.value)}
                  maxLength={2}
                  title="Ícone"
                  style={{ width: 48, textAlign: 'center', padding: '8px 4px', border: `1.5px solid ${COLORS.gray200}`, borderRadius: 8, fontSize: 18 }}
                />
                <button onClick={() => setExpandido(aberto ? null : chave)} style={btnIconeConfig(COLORS.primary)} title="Editar itens">
                  <span style={{ display: 'inline-flex', transform: aberto ? 'rotate(180deg)' : 'none', transition: 'transform .2s' }}>
                    <ChevronDown size={18} />
                  </span>
                </button>
                <button onClick={() => removerEquipamento(chave)} style={btnIconeConfig(COLORS.danger)} title="Remover equipamento">
                  <Trash2 size={16} />
                </button>
              </div>

              {/* Itens (quando aberto) */}
              {aberto && (
                <div style={{ padding: '8px 14px 14px', background: COLORS.gray50 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.gray500, textTransform: 'uppercase', letterSpacing: 0.5, margin: '6px 0 10px' }}>
                    Itens do checklist ({(eq.itens || []).length})
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                    {(eq.itens || []).map((item, idx) => (
                      <div key={idx} style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                        <span style={{ fontSize: 12, color: COLORS.gray500, width: 22, textAlign: 'right' }}>{idx + 1}.</span>
                        <input
                          type="text"
                          value={item}
                          onChange={e => editItem(chave, idx, e.target.value)}
                          placeholder="Descrição do item"
                          style={{ flex: 1, padding: '8px 10px', border: `1.5px solid ${COLORS.gray200}`, borderRadius: 8, fontSize: 14, background: COLORS.white }}
                        />
                        <button onClick={() => moverItem(chave, idx, -1)} disabled={idx === 0} style={btnIconeMini(idx === 0)} title="Subir">▲</button>
                        <button onClick={() => moverItem(chave, idx, 1)} disabled={idx === eq.itens.length - 1} style={btnIconeMini(idx === eq.itens.length - 1)} title="Descer">▼</button>
                        <button onClick={() => removeItem(chave, idx)} style={btnIconeConfig(COLORS.danger)} title="Remover item">
                          <Trash2 size={14} />
                        </button>
                      </div>
                    ))}
                  </div>
                  <button onClick={() => addItem(chave)} style={{ ...btnPrimarioConfig(), marginTop: 10, background: COLORS.accent }}>
                    <Plus size={16} /> Adicionar item
                  </button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Salvar */}
      <div style={{ marginTop: 20, display: 'flex', justifyContent: 'flex-end' }}>
        <button onClick={salvar} disabled={salvando || !houveMudanca} style={btnSalvarConfig(salvando || !houveMudanca)}>
          {salvando ? <><Spinner /> Salvando…</> : <><Save size={18} /> Salvar equipamentos</>}
        </button>
      </div>
    </div>
  );
}

// ---------------- ABA: CHECKLIST DE VEÍCULO ----------------
function AbaVeiculo({ veiculo, salvando, onSalvar }) {
  const [secoes, setSecoes] = useState(() => JSON.parse(JSON.stringify(veiculo.secoes || [])));
  const [expandido, setExpandido] = useState(0);

  function addItem(sIdx) {
    setSecoes(secoes.map((s, i) => i === sIdx ? { ...s, itens: [...s.itens, ''] } : s));
  }
  function editItem(sIdx, idx, texto) {
    setSecoes(secoes.map((s, i) => {
      if (i !== sIdx) return s;
      const itens = [...s.itens]; itens[idx] = texto;
      return { ...s, itens };
    }));
  }
  function removeItem(sIdx, idx) {
    setSecoes(secoes.map((s, i) => i === sIdx ? { ...s, itens: s.itens.filter((_, j) => j !== idx) } : s));
  }
  function moverItem(sIdx, idx, dir) {
    setSecoes(secoes.map((s, i) => {
      if (i !== sIdx) return s;
      const itens = [...s.itens];
      const novo = idx + dir;
      if (novo < 0 || novo >= itens.length) return s;
      [itens[idx], itens[novo]] = [itens[novo], itens[idx]];
      return { ...s, itens };
    }));
  }
  function editNomeSecao(sIdx, nome) {
    setSecoes(secoes.map((s, i) => i === sIdx ? { ...s, nome } : s));
  }

  function salvar() {
    for (const s of secoes) {
      if (!s.nome || !s.nome.trim()) { alert('Toda seção precisa de um nome.'); return; }
    }
    const novo = {
      secoes: secoes.map(s => ({
        nome: s.nome.trim(),
        icone: s.icone || '📋',
        itens: (s.itens || []).map(it => (it || '').trim()).filter(Boolean),
      })),
    };
    onSalvar(novo);
  }

  const houveMudanca = JSON.stringify({ secoes }) !== JSON.stringify({ secoes: veiculo.secoes });

  return (
    <div style={{ background: COLORS.white, border: `1px solid ${COLORS.gray200}`, borderRadius: 12, padding: 20 }}>
      <h3 style={{ margin: '0 0 4px', fontSize: 17, fontWeight: 800, color: COLORS.gray900 }}>Checklist de Veículo</h3>
      <p style={{ margin: '0 0 16px', fontSize: 13, color: COLORS.gray500 }}>
        O checklist de veículo é organizado em seções. Toque numa seção para editar seus itens.
      </p>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        {secoes.map((s, sIdx) => {
          const aberto = expandido === sIdx;
          return (
            <div key={sIdx} style={{ border: `1px solid ${COLORS.gray200}`, borderRadius: 10, overflow: 'hidden' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '12px 14px', background: aberto ? COLORS.gray50 : COLORS.white }}>
                <span style={{ fontSize: 22 }}>{s.icone || '📋'}</span>
                <input
                  type="text"
                  value={s.nome}
                  onChange={e => editNomeSecao(sIdx, e.target.value)}
                  style={{ flex: 1, padding: '8px 10px', border: `1.5px solid ${COLORS.gray200}`, borderRadius: 8, fontSize: 15, fontWeight: 700 }}
                />
                <span style={{ fontSize: 12, color: COLORS.gray500 }}>{s.itens.length} itens</span>
                <button onClick={() => setExpandido(aberto ? -1 : sIdx)} style={btnIconeConfig(COLORS.primary)} title="Editar itens">
                  <span style={{ display: 'inline-flex', transform: aberto ? 'rotate(180deg)' : 'none', transition: 'transform .2s' }}>
                    <ChevronDown size={18} />
                  </span>
                </button>
              </div>

              {aberto && (
                <div style={{ padding: '8px 14px 14px', background: COLORS.gray50 }}>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                    {s.itens.map((item, idx) => (
                      <div key={idx} style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                        <span style={{ fontSize: 12, color: COLORS.gray500, width: 22, textAlign: 'right' }}>{idx + 1}.</span>
                        <input
                          type="text"
                          value={item}
                          onChange={e => editItem(sIdx, idx, e.target.value)}
                          placeholder="Descrição do item"
                          style={{ flex: 1, padding: '8px 10px', border: `1.5px solid ${COLORS.gray200}`, borderRadius: 8, fontSize: 14, background: COLORS.white }}
                        />
                        <button onClick={() => moverItem(sIdx, idx, -1)} disabled={idx === 0} style={btnIconeMini(idx === 0)} title="Subir">▲</button>
                        <button onClick={() => moverItem(sIdx, idx, 1)} disabled={idx === s.itens.length - 1} style={btnIconeMini(idx === s.itens.length - 1)} title="Descer">▼</button>
                        <button onClick={() => removeItem(sIdx, idx)} style={btnIconeConfig(COLORS.danger)} title="Remover item">
                          <Trash2 size={14} />
                        </button>
                      </div>
                    ))}
                  </div>
                  <button onClick={() => addItem(sIdx)} style={{ ...btnPrimarioConfig(), marginTop: 10, background: COLORS.accent }}>
                    <Plus size={16} /> Adicionar item
                  </button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div style={{ marginTop: 20, display: 'flex', justifyContent: 'flex-end' }}>
        <button onClick={salvar} disabled={salvando || !houveMudanca} style={btnSalvarConfig(salvando || !houveMudanca)}>
          {salvando ? <><Spinner /> Salvando…</> : <><Save size={18} /> Salvar checklist de veículo</>}
        </button>
      </div>
    </div>
  );
}

// ----- estilos auxiliares de botões da config -----
function btnPrimarioConfig() {
  return {
    background: COLORS.primary, color: COLORS.white, border: 'none',
    padding: '12px 16px', borderRadius: 10, cursor: 'pointer',
    fontSize: 14, fontWeight: 700, display: 'flex', alignItems: 'center', gap: 6,
    whiteSpace: 'nowrap',
  };
}
function btnIconeConfig(cor) {
  return {
    background: COLORS.white, color: cor, border: `1.5px solid ${cor}`,
    width: 36, height: 36, borderRadius: 8, cursor: 'pointer',
    display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
  };
}
function btnIconeMini(desabilitado) {
  return {
    background: COLORS.white, color: desabilitado ? COLORS.gray300 : COLORS.gray600,
    border: `1.5px solid ${desabilitado ? COLORS.gray200 : COLORS.gray300}`,
    width: 28, height: 36, borderRadius: 8, cursor: desabilitado ? 'not-allowed' : 'pointer',
    fontSize: 11, flexShrink: 0,
  };
}
function btnSalvarConfig(desabilitado) {
  return {
    background: desabilitado ? COLORS.gray300 : COLORS.success,
    color: COLORS.white, border: 'none', padding: '12px 24px', borderRadius: 10,
    cursor: desabilitado ? 'not-allowed' : 'pointer', fontSize: 15, fontWeight: 700,
    display: 'flex', alignItems: 'center', gap: 8,
    boxShadow: desabilitado ? 'none' : '0 2px 8px rgba(16,185,129,0.25)',
  };
}

_root.render(<ChecklistAxialApp />);
